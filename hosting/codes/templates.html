<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Templates — PadSplit</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --warn: #fbbf24;
      --success: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .template-card {
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .template-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .template-label[contenteditable] {
      cursor: text;
      border-radius: 4px;
      padding: 1px 3px;
      margin: -1px -3px;
      outline: none;
      transition: background 0.15s;
    }
    .template-label[contenteditable]:hover {
      background: rgba(148,163,184,0.1);
    }
    .template-label[contenteditable]:focus {
      background: rgba(56,189,248,0.08);
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      padding: 0.65rem 0.75rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .save-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .save-btn:hover { color: var(--success); border-color: var(--success); }
    .copy-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      display: flex;
      align-items: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .copy-btn.copied { color: var(--success); border-color: var(--success); }
    .notes-section { margin-top: 2rem; }
    .notes-section h2 { margin: 0 0 0.75rem; font-size: 1.2rem; }
    .notes-card { background: var(--card); border: 1px solid rgba(148,163,184,.15); border-radius: 12px; padding: 1rem; }
    .notes-textarea { width: 100%; min-height: 120px; background: rgba(255,255,255,.04); border: 1px solid rgba(148,163,184,.2); border-radius: 8px; color: var(--text); font-family: inherit; font-size: .9rem; line-height: 1.5; padding: .65rem .75rem; resize: vertical; outline: none; transition: border-color .15s; box-sizing: border-box; }
    .notes-textarea:focus { border-color: var(--accent); }
    .notes-footer { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; margin-top: .5rem; }
    .notes-save-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: .8rem; padding: .3rem .65rem; transition: color .15s, border-color .15s; }
    .notes-save-btn:hover { color: var(--success); border-color: var(--success); }
    .notes-save-error { margin: 0.45rem 0 0; color: #f87171; font-size: 0.8rem; }
    .notes-copy-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; padding: .3rem .5rem; display: flex; align-items: center; transition: color .15s, border-color .15s; }
    .notes-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .notes-copy-btn.copied { color: var(--success); border-color: var(--success); }
    .notes-copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }
    #page-status { color: var(--muted); margin: 0 0 1rem; }
    #page-nav.hidden, #page-data.hidden, #page-status.hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="gate-wrap" style="position:fixed;inset:0;z-index:100;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:2rem">
    <div style="max-width:380px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0));border:1px solid rgba(148,163,184,0.2);border-radius:12px;padding:1.5rem;box-shadow:0 14px 40px rgba(15,23,42,0.4)">
      <h2 style="margin:0 0 0.35rem;font-size:1.2rem;color:#e2e8f0">Sign In</h2>
      <p style="margin:0 0 1rem;color:#94a3b8;font-size:0.9rem">PadSplit Dashboard</p>
      <form id="gate-form" style="display:flex;flex-direction:column;gap:0.5rem">
        <input id="gate-email" type="email" placeholder="Email" autocomplete="email" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <input id="gate-password" type="password" placeholder="Password" autocomplete="current-password" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <button type="submit" style="border:none;border-radius:8px;background:#38bdf8;color:#0b1222;font-weight:700;padding:0.45rem 0.9rem;cursor:pointer;margin-top:0.25rem;font-family:inherit">Sign In</button>
      </form>
      <div id="gate-error" style="color:#f87171;font-size:0.9rem;margin-top:0.6rem;display:none">Incorrect email or password.</div>
    </div>
  </div>
  <div id="app-wrap" class="hidden">
  <header>
    <h1>Templates</h1>
    <div class="header-meta">
      <nav id="page-nav">
        <a href="./index.html" class="header-link">Dashboard</a>
        <a href="./private-messages.html" class="header-link">Tenant Messages</a>
        <a href="./codes.html" class="header-link">Codes</a>
        <a href="./vendors.html" class="header-link">Vendors</a>
        <a href="./stats.html" class="header-link">Stats</a>
      </nav>
      <button id="signout-btn" class="header-link" style="background:none;border:none;cursor:pointer;padding:0">Sign out</button>
    </div>
  </header>

  <p id="page-status" class="hidden"></p>
  <div id="page-data">
  <div class="grid" id="templates-grid"></div>

  <section class="notes-section hidden">
    <h2>Notes</h2>
    <div class="notes-card">
      <textarea class="notes-textarea" id="notes-textarea" placeholder="Add shared notes…"></textarea>
      <div class="notes-footer">
        <button class="notes-save-btn" id="notes-save-btn">Save</button>
        <button class="notes-copy-btn" id="notes-copy-btn" title="Copy notes"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
      <p id="notes-save-error" class="notes-save-error" hidden></p>
    </div>
    </section>
  </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCSWOHI6QLqugy_Fao2p4bBehg02_fu3No",
      authDomain: "padsplit-scrapper.firebaseapp.com",
      projectId: "padsplit-scrapper",
      storageBucket: "padsplit-scrapper.firebasestorage.app",
      messagingSenderId: "281696703679",
      appId: "1:281696703679:web:f94ba04e92cb43b4f9a20a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const TEMPLATE_DOC = doc(db, "templates", "shared");
    const COUNT = 9;

    const textareas = [];
    const labels = [];

    function buildGrid() {
      const grid = document.getElementById('templates-grid');
      grid.innerHTML = '';
      textareas.length = 0;
      labels.length = 0;

      for (let i = 0; i < COUNT; i++) {
        const card = document.createElement('div');
        card.className = 'template-card';

        const label = document.createElement('div');
        label.className = 'template-label';
        label.contentEditable = 'true';
        label.spellcheck = false;
        label.dataset.index = i;
        label.textContent = `Template ${i + 1}`;
        labels.push(label);

        label.addEventListener('blur', async () => {
          const update = {};
          update[`n${i}`] = label.textContent.trim();
          await setDoc(TEMPLATE_DOC, update, { merge: true });
        });

        label.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            label.blur();
          }
        });

        const textarea = document.createElement('textarea');
        textarea.placeholder = `Template ${i + 1}…`;
        textareas.push(textarea);

        const footer = document.createElement('div');
        footer.className = 'card-footer';

        const saveBtn = document.createElement('button');
        saveBtn.className = 'save-btn';
        saveBtn.textContent = 'Save';
        saveBtn.addEventListener('click', async () => {
          saveBtn.textContent = 'Saving…';
          saveBtn.disabled = true;
          try {
            const update = {};
            update[`t${i}`] = textarea.value;
            await setDoc(TEMPLATE_DOC, update, { merge: true });
            saveBtn.textContent = 'Saved!';
            pageStatus.textContent = 'Saved. The private snapshot updates on the next scrape.';
            pageStatus.classList.remove('hidden');
          } catch (e) {
            saveBtn.textContent = 'Error';
          }
          setTimeout(() => { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1500);
        });

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.title = 'Copy to clipboard';
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(textarea.value).then(() => {
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 1500);
          });
        });

        footer.appendChild(saveBtn);
        footer.appendChild(copyBtn);
        card.appendChild(label);
        card.appendChild(textarea);
        card.appendChild(footer);
        grid.appendChild(card);
      }
    }

    function applyFields(fields) {
      const data = fields || {};
      textareas.forEach((ta, i) => {
        if (document.activeElement !== ta) ta.value = data[`t${i}`] ?? '';
      });
      labels.forEach((lbl, i) => {
        if (document.activeElement !== lbl) lbl.textContent = data[`n${i}`] || `Template ${i + 1}`;
      });
    }

    function clearTemplates() {
      const grid = document.getElementById('templates-grid');
      if (grid) grid.innerHTML = '';
      textareas.length = 0;
      labels.length = 0;
      const notes = document.querySelector('.notes-section');
      if (notes) notes.classList.add('hidden');
      if (notesTA) notesTA.value = '';
    }

    applyHostedNav();

    function angCodesUid() {
      return '8jOJNgLoxpfyseZ0RY1PDZ1DXbi2';
    }
    function approvedCodesUid() {
      // Joe's slot. Same empty return as firestore.rules approvedCodesUid(). Ang keeps angCodesUid().
      return '';
    }
    function isApprovedCodesUser(user) {
      if (!user || !user.uid) return false;
      if (user.uid === angCodesUid()) return true;
      const joe = approvedCodesUid();
      return !!(joe && user.uid === joe);
    }
    function isPermissionDenied(err) {
      const code = err && err.code ? String(err.code) : '';
      return code === 'permission-denied' || code.endsWith('/permission-denied');
    }

    const gateWrap = document.getElementById('gate-wrap');
    const appWrap = document.getElementById('app-wrap');
    const gateForm = document.getElementById('gate-form');
    const gateError = document.getElementById('gate-error');
    const pageStatus = document.getElementById('page-status');
    let loadGeneration = 0;
    let notesUnsub = null;
    const NOTES_DOC = doc(db, 'notes', 'templates');
    const notesTA = document.getElementById('notes-textarea');
    const notesSave = document.getElementById('notes-save-btn');
    const notesCopy = document.getElementById('notes-copy-btn');
    const notesError = document.getElementById('notes-save-error');

    // begin notes-save
    const NOTES_LIMIT = 20000;
    const NOTES_TOO_LONG = "too long to save (20,000 character limit). nothing was saved.";
    const NOTES_SAVE_FAILED = "couldn't save. your text is still here. sign in again and retry.";
    function bindNotesPad(textarea, errorEl, saveBtn, writeText) {
      let holdLocal = false;
      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = false;
      }
      function clearError() {
        errorEl.textContent = "";
        errorEl.hidden = true;
      }
      function applyServerText(text, active) {
        if (holdLocal || active) return false;
        textarea.value = text || "";
        return true;
      }
      function onListenerError() {
        return false;
      }
      async function save() {
        const text = textarea.value;
        if (text.length >= NOTES_LIMIT) {
          holdLocal = true;
          showError(NOTES_TOO_LONG);
          saveBtn.textContent = "Save";
          saveBtn.disabled = false;
          return;
        }
        holdLocal = true;
        saveBtn.textContent = "Saving…";
        saveBtn.disabled = true;
        try {
          await writeText(text);
          holdLocal = textarea.value !== text;
          clearError();
          saveBtn.textContent = "Saved!";
        } catch {
          holdLocal = true;
          showError(NOTES_SAVE_FAILED);
          saveBtn.textContent = "Save";
        }
        saveBtn.disabled = false;
        if (saveBtn.textContent === "Saved!") {
          setTimeout(() => {
            if (saveBtn.textContent === "Saved!") saveBtn.textContent = "Save";
          }, 1500);
        }
      }
      return { applyServerText, onListenerError, save };
    }
    // end notes-save

    const notesPad = bindNotesPad(notesTA, notesError, notesSave, (text) => (
      setDoc(NOTES_DOC, { text }, { merge: true })
    ));

    function stopNotes() {
      if (notesUnsub) {
        notesUnsub();
        notesUnsub = null;
      }
      if (notesTA) notesTA.value = '';
    }
    function startNotes() {
      if (notesUnsub || !notesTA) return;
      notesUnsub = onSnapshot(NOTES_DOC, (snap) => {
        const serverText = snap.exists() ? (snap.data().text || '') : '';
        notesPad.applyServerText(serverText, document.activeElement === notesTA);
      }, () => {
        notesPad.onListenerError();
      });
    }
    notesSave.addEventListener('click', () => { notesPad.save(); });
    notesCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(notesTA.value).then(() => {
        notesCopy.classList.add('copied');
        setTimeout(() => notesCopy.classList.remove('copied'), 1500);
      });
    });

    // hosted-page-state
    const HIDE_DATA_WHEN_EMPTY = false;
    const EMPTY_COPY = "no templates saved yet.";
    function clearPageRows() {
      const grid = document.getElementById('templates-grid');
      if (grid) grid.innerHTML = '';
      const notes = document.querySelector('.notes-section');
      if (notes) notes.classList.add('hidden');
    }
    function setChrome(mode, message) {
      const gate = document.getElementById('gate-wrap');
      const app = document.getElementById('app-wrap');
      const nav = document.getElementById('page-nav');
      const data = document.getElementById('page-data');
      const status = document.getElementById('page-status');
      const signout = document.getElementById('signout-btn');
      const signedOut = mode === 'signed-out';
      if (gate) gate.classList.toggle('hidden', !signedOut);
      if (app) app.classList.toggle('hidden', signedOut);
      if (nav) nav.classList.toggle('hidden', signedOut || mode === 'denied');
      const showData = mode === 'ready' || (mode === 'empty' && !HIDE_DATA_WHEN_EMPTY);
      if (data) data.classList.toggle('hidden', !showData);
      if (signout) signout.classList.toggle('hidden', signedOut);
      if (status) {
        status.textContent = message || '';
        status.classList.toggle('hidden', !message);
      }
      if (mode !== 'ready') clearPageRows();
    }
    function applyHostedNav() {
      if (location.hostname.endsWith('github.io')) return;
      document.querySelectorAll('.pages-only').forEach((el) => el.remove());
      const nav = document.getElementById('page-nav');
      document.querySelectorAll('a[href]').forEach((link) => {
        if (nav && nav.contains(link)) return;
        const href = link.getAttribute('href') || '';
        const file = href.split('#')[0].split('/').pop();
        if (file === 'codes.html' || file === 'templates.html' || file === 'vendors.html' || file === 'stats.html') return;
        const span = document.createElement('span');
        span.textContent = link.textContent;
        link.replaceWith(span);
      });
      if (!nav) return;
      const page = (location.pathname.split('/').pop() || '').split('?')[0];
      nav.replaceChildren();
      [
        ['codes.html', 'codes'],
        ['templates.html', 'templates'],
        ['vendors.html', 'vendors'],
        ['stats.html', 'stats']
      ].forEach(([file, label], index) => {
        if (index) nav.appendChild(document.createTextNode(' · '));
        if (file === page) {
          const span = document.createElement('span');
          span.textContent = label;
          nav.appendChild(span);
        } else {
          const a = document.createElement('a');
          a.className = 'header-link';
          a.href = './' + file;
          a.textContent = label;
          nav.appendChild(a);
        }
      });
    }
    function assemblePrivatePage(parent, parts) {
      if (!parent || parent.exists === false) return null;
      const data = parent.data && typeof parent.data === 'object' ? parent.data : {};
      const count = Number(data.chunk_count || 1);
      if (!(count > 1)) {
        const raw = data.json == null ? '' : String(data.json);
        if (!raw) return null;
        return JSON.parse(raw);
      }
      const slices = [];
      for (let i = 0; i < count; i++) {
        const part = parts ? parts[i] : null;
        const piece = part && part.exists !== false && part.data ? part.data.json : null;
        if (piece == null || piece === '') {
          const err = new Error('private page chunk missing');
          err.code = 'chunk-missing';
          throw err;
        }
        slices.push(String(piece));
      }
      const raw = slices.join('');
      if (!raw) return null;
      return JSON.parse(raw);
    }
    function pagePayloadEmpty(value) {
      return !(value && value.fields && typeof value.fields === 'object' && Object.keys(value.fields).length);
    }
    function presentPrivatePage(parent, parts, render) {
      let value;
      try {
        value = assemblePrivatePage(parent, parts);
      } catch (err) {
        showLoadError();
        return;
      }
      if (value == null || pagePayloadEmpty(value)) {
        showEmpty();
        return;
      }
      try {
        showReady();
        render(value);
      } catch (err) {
        showLoadError();
      }
    }
    function showSignedOut() {
      clearTemplates();
      stopNotes();
      setChrome('signed-out', '');
    }
    function showLoading() {
      clearTemplates();
      stopNotes();
      setChrome('loading', 'loading…');
    }
    function showNotApproved() {
      clearTemplates();
      stopNotes();
      setChrome('denied', "this account isn't approved. ask ang to add it.");
    }
    function showEmpty() {
      clearTemplates();
      stopNotes();
      setChrome('empty', EMPTY_COPY);
    }
    function showLoadError() {
      clearTemplates();
      stopNotes();
      setChrome('error', "couldn't load. refresh or sign in again.");
    }
    function showReady() {
      setChrome('ready', '');
    }
    // hosted-page-state-end

    async function readPrivatePage(pageId) {
      const snap = await getDoc(doc(db, "private_pages", pageId));
      const parent = { exists: snap.exists(), data: snap.exists() ? (snap.data() || {}) : null };
      const count = Number((parent.data && parent.data.chunk_count) || 1);
      const parts = [];
      if (parent.exists && count > 1) {
        for (let i = 0; i < count; i++) {
          const part = await getDoc(doc(db, "private_pages", pageId, "parts", String(i)));
          parts.push({ exists: part.exists(), data: part.exists() ? (part.data() || {}) : null });
        }
      }
      return { parent, parts };
    }
    async function loadPrivatePage(generation) {
      const loaded = await readPrivatePage("templates");
      if (generation !== loadGeneration) return;
      presentPrivatePage(loaded.parent, loaded.parts, (value) => {
        buildGrid();
        applyFields(value.fields || {});
        document.querySelector('.notes-section').classList.remove('hidden');
        startNotes();
      });
    }

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('gate-email').value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, document.getElementById('gate-password').value);
        gateError.style.display = 'none';
      } catch (err) {
        console.error('sign-in failed', err && err.code);
        gateError.style.display = 'block';
      }
    });

    showSignedOut();
    onAuthStateChanged(auth, (user) => {
      const generation = ++loadGeneration;
      if (!user) {
        showSignedOut();
        return;
      }
      if (!isApprovedCodesUser(user)) {
        showNotApproved();
        return;
      }
      showLoading();
      loadPrivatePage(generation).catch((err) => {
        if (generation !== loadGeneration) return;
        console.error('templates load failed', err && err.code);
        clearTemplates();
        stopNotes();
        if (isPermissionDenied(err)) showNotApproved();
        else showLoadError();
      });
    });

    document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));
  </script>
</body>
</html>
