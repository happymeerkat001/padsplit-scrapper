<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PadSplit Vendors</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #fbbf24;
      --error: #f87171;
      --text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(34,197,94,0.08), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }

    /* Vendors */
    .vendor-section { margin-top: 0; }
    .vendor-section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .vendor-section-header h2 { margin: 0; font-size: 1.2rem; }
    .add-vendor-btn {
      background: none;
      border: 1px solid rgba(56,189,248,0.4);
      border-radius: 6px;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      transition: background 0.15s;
    }
    .add-vendor-btn:hover { background: rgba(56,189,248,0.1); }
    .vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .vendor-card {
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .vendor-field-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.15rem;
    }
    .vendor-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.4rem 0.6rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .vendor-input:focus { border-color: var(--accent); }
    .vendor-card-footer { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; margin-top: 0.25rem; }
    .v-save-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .v-save-btn:hover { color: var(--success); border-color: var(--success); }
    .v-copy-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      display: flex;
      align-items: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .v-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .v-copy-btn.copied { color: var(--success); border-color: var(--success); }
    .v-copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .v-del-btn {
      background: none;
      border: none;
      color: rgba(248,113,113,0.5);
      cursor: pointer;
      font-size: 0.85rem;
      margin-right: auto;
      padding: 0.2rem 0.3rem;
      transition: color 0.15s;
    }
    .v-del-btn:hover { color: var(--error); }
    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .hidden { display: none !important; }
    #page-status { color: var(--muted); margin: 0 0 1rem; }
  </style>
</head>
<body>
  <div id="gate-wrap" style="position:fixed;inset:0;z-index:100;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:2rem">
    <div style="max-width:380px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0));border:1px solid rgba(148,163,184,0.2);border-radius:12px;padding:1.5rem;box-shadow:0 14px 40px rgba(15,23,42,0.4)">
      <h2 style="margin:0 0 0.35rem;font-size:1.2rem;color:#e2e8f0">Sign In</h2>
      <p style="margin:0 0 1rem;color:#94a3b8;font-size:0.9rem">PadSplit Dashboard</p>
      <form id="gate-form" style="display:flex;flex-direction:column;gap:0.5rem">
        <input id="gate-email" type="email" placeholder="Email" autocomplete="email" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <input id="gate-password" type="password" placeholder="Password" autocomplete="current-password" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <button type="submit" style="border:none;border-radius:8px;background:#38bdf8;color:#0b1222;font-weight:700;padding:0.45rem 0.9rem;cursor:pointer;margin-top:0.25rem;font-family:inherit">Sign In</button>
      </form>
      <div id="gate-error" style="color:#f87171;font-size:0.9rem;margin-top:0.6rem;display:none">Incorrect email or password.</div>
    </div>
  </div>
  <div id="app-wrap" class="hidden">
  <header>
    <h1>Vendors</h1>
    <div class="header-meta">
      <a href="./index.html" class="header-link">Dashboard</a>
      <a href="./private-messages.html" class="header-link">Tenant Messages</a>
      <a href="./templates.html" class="header-link">Templates</a>
      <a href="./codes.html" class="header-link">Codes</a>
      <a href="./stats.html" class="header-link">Stats</a>
      <button id="signout-btn" class="header-link" style="background:none;border:none;cursor:pointer;padding:0">Sign out</button>
    </div>
  </header>

  <p id="page-status" class="hidden"></p>
  <div class="vendor-section">
    <div class="vendor-section-header">
      <h2>Vendors</h2>
      <button class="add-vendor-btn" id="add-vendor-btn">+ Add Vendor</button>
    </div>
    <div class="vendor-grid" id="vendor-grid">
      <p id="vendor-status" style="color:var(--muted);font-size:0.85rem">Loading vendors…</p>
    </div>
  </div>

  <footer>
    Edits save to the vendor store. This view reloads from the private snapshot after the next scrape.
  </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCSWOHI6QLqugy_Fao2p4bBehg02_fu3No",
      authDomain: "padsplit-scrapper.firebaseapp.com",
      projectId: "padsplit-scrapper",
      storageBucket: "padsplit-scrapper.firebasestorage.app",
      messagingSenderId: "281696703679",
      appId: "1:281696703679:web:f94ba04e92cb43b4f9a20a"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ── Vendors ──────────────────────────────────────────────────────────────
    const COPY_ICON = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

    function buildVendorCard(docId, data = {}) {
      const card = document.createElement('div');
      card.className = 'vendor-card';
      card.dataset.docId = docId;

      const fields = [
        { key: 'name',      label: 'Name',             placeholder: 'e.g. John Smith' },
        { key: 'specialty', label: 'Specialty',         placeholder: 'e.g. Plumbing' },
        { key: 'contact',   label: 'Contact',           placeholder: 'Phone or email' },
        { key: 'location',  label: 'Location / Area',   placeholder: 'e.g. Dallas, TX' },
      ];

      const inputs = {};
      fields.forEach(({ key, label, placeholder }) => {
        const lbl = document.createElement('div');
        lbl.className = 'vendor-field-label';
        lbl.textContent = label;
        const inp = document.createElement('input');
        inp.className = 'vendor-input';
        inp.placeholder = placeholder;
        inp.value = data[key] || '';
        inputs[key] = inp;
        card.appendChild(lbl);
        card.appendChild(inp);
      });

      const footer = document.createElement('div');
      footer.className = 'vendor-card-footer';

      const delBtn = document.createElement('button');
      delBtn.className = 'v-del-btn';
      delBtn.title = 'Delete vendor';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', async () => {
        if (!confirm('Delete this vendor?')) return;
        await deleteDoc(doc(db, 'vendors', docId));
      });

      const saveBtn = document.createElement('button');
      saveBtn.className = 'v-save-btn';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', async () => {
        saveBtn.textContent = 'Saving…';
        saveBtn.disabled = true;
        try {
          await setDoc(doc(db, 'vendors', docId), {
            name:      inputs.name.value.trim(),
            specialty: inputs.specialty.value.trim(),
            contact:   inputs.contact.value.trim(),
            location:  inputs.location.value.trim(),
          }, { merge: true });
          saveBtn.textContent = 'Saved!';
          pageStatus.textContent = 'Saved. The private snapshot updates on the next scrape.';
          pageStatus.classList.remove('hidden');
        } catch {
          saveBtn.textContent = 'Error';
        }
        setTimeout(() => { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1500);
      });

      const copyBtn = document.createElement('button');
      copyBtn.className = 'v-copy-btn';
      copyBtn.title = 'Copy to clipboard';
      copyBtn.innerHTML = COPY_ICON;
      copyBtn.addEventListener('click', () => {
        const text = [
          inputs.name.value,
          inputs.specialty.value,
          inputs.contact.value,
          inputs.location.value,
        ].filter(Boolean).join(' | ');
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.classList.add('copied');
          setTimeout(() => copyBtn.classList.remove('copied'), 1500);
        });
      });

      footer.appendChild(delBtn);
      footer.appendChild(saveBtn);
      footer.appendChild(copyBtn);
      card.appendChild(footer);
      return card;
    }

    const vendorGrid = document.getElementById('vendor-grid');
    const vendorCards = new Map(); // docId → card element
    function upsertVendorStatus(message, colorVar = 'var(--muted)') {
      let status = document.getElementById('vendor-status');
      if (!status) {
        status = document.createElement('p');
        status.id = 'vendor-status';
        status.style.fontSize = '0.85rem';
        vendorGrid.appendChild(status);
      }
      status.textContent = message;
      status.style.color = colorVar;
    }

    function clearVendors() {
      vendorCards.forEach((card) => card.remove());
      vendorCards.clear();
      const status = document.getElementById('vendor-status');
      if (status) status.remove();
    }
    function renderVendors(rows) {
      clearVendors();
      const list = Array.isArray(rows) ? rows : [];
      if (!list.length) {
        upsertVendorStatus('No vendors yet. Click + Add Vendor to create one.');
        return;
      }
      list.forEach((row) => {
        const docId = row && row.id ? String(row.id) : '';
        if (!docId) return;
        const card = buildVendorCard(docId, row);
        vendorCards.set(docId, card);
        vendorGrid.appendChild(card);
      });
    }

    document.getElementById('add-vendor-btn').addEventListener('click', async () => {
      const ref = await addDoc(collection(db, 'vendors'), {
        name: '', specialty: '', contact: '', location: '',
      });
      const card = buildVendorCard(ref.id, {});
      vendorCards.set(ref.id, card);
      vendorGrid.appendChild(card);
      document.getElementById('vendor-status')?.remove();
      pageStatus.textContent = 'Saved. The private snapshot updates on the next scrape.';
      pageStatus.classList.remove('hidden');
    });

    const HOSTED_NAV = [
      ["./codes.html", "Codes"],
      ["./templates.html", "Templates"],
      ["./vendors.html", "Vendors"],
      ["./stats.html", "Stats"]
    ];
    function applyHostedNav() {
      if (location.hostname.endsWith('github.io')) return;
      document.querySelectorAll('.pages-only').forEach((el) => el.remove());
      document.querySelectorAll('a[href]').forEach((link) => {
        if (link.classList.contains('header-link')) return;
        const href = link.getAttribute('href') || '';
        const file = href.split('#')[0].split('/').pop();
        if (file && file.endsWith('.html') && !HOSTED_NAV.some(([item]) => item.slice(2) === file)) {
          const span = document.createElement('span');
          span.textContent = link.textContent;
          link.replaceWith(span);
        }
      });
      const meta = document.querySelector('.header-meta');
      if (!meta) return;
      const page = (location.pathname.split('/').pop() || '').split('?')[0];
      meta.querySelectorAll('a.header-link').forEach((link) => link.remove());
      const signout = document.getElementById('signout-btn');
      HOSTED_NAV.forEach(([href, label]) => {
        if (href.slice(2) === page) return;
        const a = document.createElement('a');
        a.className = 'header-link';
        a.href = href;
        a.textContent = label;
        if (signout && signout.parentElement === meta) meta.insertBefore(a, signout);
        else meta.appendChild(a);
      });
    }
    applyHostedNav();

    function angCodesUid() {
      return '8jOJNgLoxpfyseZ0RY1PDZ1DXbi2';
    }
    function approvedCodesUid() {
      // Joe's slot. Same empty return as firestore.rules approvedCodesUid(). Ang keeps angCodesUid().
      return '';
    }
    function isApprovedCodesUser(user) {
      if (!user || !user.uid) return false;
      if (user.uid === angCodesUid()) return true;
      const joe = approvedCodesUid();
      return !!(joe && user.uid === joe);
    }
    function isPermissionDenied(err) {
      const code = err && err.code ? String(err.code) : '';
      return code === 'permission-denied' || code.endsWith('/permission-denied');
    }

    const gateWrap = document.getElementById('gate-wrap');
    const appWrap = document.getElementById('app-wrap');
    const gateForm = document.getElementById('gate-form');
    const gateError = document.getElementById('gate-error');
    const pageStatus = document.getElementById('page-status');
    let loadGeneration = 0;

    function showSignedOut() {
      gateWrap.style.display = 'flex';
      appWrap.classList.add('hidden');
      clearVendors();
      pageStatus.classList.add('hidden');
    }
    function showNotApproved() {
      gateWrap.style.display = 'none';
      appWrap.classList.remove('hidden');
      clearVendors();
      pageStatus.textContent = "your account isn't approved for this page yet. ask ang.";
      pageStatus.classList.remove('hidden');
    }
    function showApp() {
      gateWrap.style.display = 'none';
      appWrap.classList.remove('hidden');
      pageStatus.textContent = 'Loading…';
      pageStatus.classList.remove('hidden');
    }

    async function readPrivatePage(pageId) {
      const snap = await getDoc(doc(db, "private_pages", pageId));
      if (!snap.exists()) throw new Error("private page missing");
      const data = snap.data() || {};
      const count = Number(data.chunk_count || 1);
      let raw = "";
      if (count <= 1) {
        raw = data.json == null ? "" : String(data.json);
      } else {
        const parts = [];
        for (let i = 0; i < count; i++) {
          const part = await getDoc(doc(db, "private_pages", pageId, "parts", String(i)));
          if (!part.exists()) throw new Error("private page chunk missing");
          parts.push(part.data().json == null ? "" : String(part.data().json));
        }
        raw = parts.join("");
      }
      if (!raw) throw new Error("private page empty");
      return JSON.parse(raw);
    }
    async function loadPrivatePage(generation) {
      const data = await readPrivatePage("vendors");
      if (generation !== loadGeneration) return;
      renderVendors(data && data.vendors);
      pageStatus.classList.add('hidden');
    }

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('gate-email').value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, document.getElementById('gate-password').value);
        gateError.style.display = 'none';
      } catch (err) {
        console.error('sign-in failed', err && err.code);
        gateError.style.display = 'block';
      }
    });

    showSignedOut();
    onAuthStateChanged(auth, (user) => {
      const generation = ++loadGeneration;
      if (!user) {
        showSignedOut();
        return;
      }
      if (!isApprovedCodesUser(user)) {
        showNotApproved();
        return;
      }
      showApp();
      loadPrivatePage(generation).catch((err) => {
        if (generation !== loadGeneration) return;
        console.error('vendors load failed', err && err.code);
        clearVendors();
        if (isPermissionDenied(err)) showNotApproved();
        else {
          pageStatus.textContent = "couldn't load vendors. refresh and try again.";
          pageStatus.classList.remove('hidden');
        }
      });
    });

    document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));
  </script>
</body>
</html>
