name: PadSplit Scrape

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: padsplit-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r padsplit_scraper/requirements.txt

      - name: Run scraper
        env:
          PADSPLIT_EMAIL: ${{ secrets.PADSPLIT_EMAIL }}
          PADSPLIT_PASSWORD: ${{ secrets.PADSPLIT_PASSWORD }}
        run: python padsplit_scraper/scraper.py

      - name: Inspect scrape status
        id: scrape_status
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          latest_path = Path("padsplit_scraper/output/latest.json")
          state = "missing"
          mode = ""
          failed_phase = ""
          if latest_path.exists():
              payload = json.loads(latest_path.read_text())
              run_status = payload.get("run_status") or {}
              state = run_status.get("state") or "ok"
              mode = run_status.get("mode") or ""
              failed_phase = run_status.get("failed_phase") or ""

          print(f"state={state}")
          print(f"mode={mode}")
          print(f"failed_phase={failed_phase}")
          PY

      - name: Warn on degraded scrape
        if: steps.scrape_status.outputs.state == 'degraded'
        run: |
          echo "::warning title=PadSplit scrape degraded::Mode=${{ steps.scrape_status.outputs.mode }} failed_phase=${{ steps.scrape_status.outputs.failed_phase }}. Fresh messages were saved and prior stats were reused."

      - name: Copy latest snapshot for Pages
        run: |
          mkdir -p docs/data
          cp padsplit_scraper/output/latest.json docs/data/latest.json
          cp padsplit_scraper/output/stats.json docs/data/stats.json || echo "stats.json not found, skipping"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add docs/data/latest.json docs/data/stats.json docs/data/monthly_history.json
          git diff --cached --quiet || git commit -m "chore: scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ PadSplit scrape failed\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
