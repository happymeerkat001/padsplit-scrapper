name: PadSplit Scrape

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: padsplit-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r padsplit_scraper/requirements.txt

      - name: Run scraper
        env:
          PADSPLIT_EMAIL: ${{ secrets.PADSPLIT_EMAIL }}
          PADSPLIT_PASSWORD: ${{ secrets.PADSPLIT_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python padsplit_scraper/scraper.py

      - name: Inspect scrape status
        id: scrape_status
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          latest_path = Path("padsplit_scraper/output/latest.json")
          state = "missing"
          mode = ""
          failed_phase = ""
          if latest_path.exists():
              payload = json.loads(latest_path.read_text())
              run_status = payload.get("run_status") or {}
              state = run_status.get("state") or "ok"
              mode = run_status.get("mode") or ""
              failed_phase = run_status.get("failed_phase") or ""

          print(f"state={state}")
          print(f"mode={mode}")
          print(f"failed_phase={failed_phase}")
          PY

      - name: Warn on degraded scrape
        if: steps.scrape_status.outputs.state == 'degraded'
        run: |
          echo "::warning title=PadSplit scrape degraded::Mode=${{ steps.scrape_status.outputs.mode }} failed_phase=${{ steps.scrape_status.outputs.failed_phase }}. Fresh messages were saved and prior stats were reused."

      - name: Copy latest snapshot for Pages
        run: |
          mkdir -p docs/data
          python - <<'PY'
          import json
          from pathlib import Path

          from padsplit_scraper.publish_sanitize import sanitize_published_snapshot

          docs = Path("docs/data")
          latest_raw = json.loads(Path("padsplit_scraper/output/latest.json").read_text())
          published = sanitize_published_snapshot(latest_raw)
          (docs / "latest.json").write_text(json.dumps(published, indent=2) + "\n")
          occupancy_path = Path("padsplit_scraper/output/occupancy.json")
          if occupancy_path.is_file():
              occupancy = sanitize_published_snapshot(json.loads(occupancy_path.read_text()))
              (docs / "occupancy.json").write_text(json.dumps(occupancy, indent=2) + "\n")
          else:
              print("occupancy.json not found, skipping")
          PY

      - name: Reject unsanitized public snapshots
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          files = sorted(str(path) for path in Path("docs/data").glob("*.json"))
          tracked = subprocess.check_output(
              ["git", "ls-files", "--", "padsplit_scraper/output"],
              text=True,
          )
          files.extend(
              line for line in tracked.splitlines() if line.endswith(".json")
          )
          if not files:
              sys.stderr.write("no public snapshots to check\n")
              sys.exit(1)
          sys.exit(
              subprocess.call(
                  [sys.executable, "padsplit_scraper/check_published_snapshot.py", *files]
              )
          )
          PY

      - name: Diagnose token permissions
        run: |
          echo "=== Token write check ==="
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}"
          echo ""
          echo "=== Branch protection check ==="
          curl -s -w "\nHTTP %{http_code}\n" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/${{ github.ref_name }}/protection"
          echo "=== Git credential helper ==="
          git config --list | grep -i "credential\|url\|helper" || echo "No credential config found"
          echo "=== Git remote ==="
          git remote -v

      - name: Commit and push snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase --autostash
          git add docs/data/latest.json docs/data/occupancy.json
          git diff --cached --quiet || git commit -m "chore: scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ PadSplit scrape failed\nRepo: ${{ github.repository }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
