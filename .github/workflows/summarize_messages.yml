name: Summarize Messages

on:
  schedule:
    - cron: '17 1,10,18 * * *'
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test summarizer without network access
        run: python -m unittest test_message_summarizer test_minimax_responses

      - name: Verify required secrets are set
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DISCORD_WEBHOOK_MESSAGES: ${{ secrets.DISCORD_WEBHOOK_MESSAGES }}
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "::error::MINIMAX_API_KEY secret is not set."
            exit 1
          fi
          if [ -z "$DISCORD_WEBHOOK_MESSAGES" ]; then
            echo "::error::DISCORD_WEBHOOK_MESSAGES secret is not set — message summaries cannot be sent to Discord."
            exit 1
          fi

      - name: Summarize messages with MiniMax AI
        env:
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M2.5' }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DISCORD_WEBHOOK_MESSAGES: ${{ secrets.DISCORD_WEBHOOK_MESSAGES }}
        run: python message_summarizer.py
