<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Templates — PadSplit</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --warn: #fbbf24;
      --success: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .template-card {
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .template-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .template-label[contenteditable] {
      cursor: text;
      border-radius: 4px;
      padding: 1px 3px;
      margin: -1px -3px;
      outline: none;
      transition: background 0.15s;
    }
    .template-label[contenteditable]:hover {
      background: rgba(148,163,184,0.1);
    }
    .template-label[contenteditable]:focus {
      background: rgba(56,189,248,0.08);
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      padding: 0.65rem 0.75rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    .save-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .save-btn:hover { color: var(--success); border-color: var(--success); }
    .copy-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      display: flex;
      align-items: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .copy-btn.copied { color: var(--success); border-color: var(--success); }
    .notes-section { margin-top: 2rem; }
    .notes-section h2 { margin: 0 0 0.75rem; font-size: 1.2rem; }
    .notes-card { background: var(--card); border: 1px solid rgba(148,163,184,.15); border-radius: 12px; padding: 1rem; }
    .notes-textarea { width: 100%; min-height: 120px; background: rgba(255,255,255,.04); border: 1px solid rgba(148,163,184,.2); border-radius: 8px; color: var(--text); font-family: inherit; font-size: .9rem; line-height: 1.5; padding: .65rem .75rem; resize: vertical; outline: none; transition: border-color .15s; box-sizing: border-box; }
    .notes-textarea:focus { border-color: var(--accent); }
    .notes-footer { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; margin-top: .5rem; }
    .notes-save-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: .8rem; padding: .3rem .65rem; transition: color .15s, border-color .15s; }
    .notes-save-btn:hover { color: var(--success); border-color: var(--success); }
    .notes-copy-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; padding: .3rem .5rem; display: flex; align-items: center; transition: color .15s, border-color .15s; }
    .notes-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .notes-copy-btn.copied { color: var(--success); border-color: var(--success); }
    .notes-copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header>
    <h1>Templates</h1>
    <div class="header-meta">
      <a href="./index.html" class="header-link">Dashboard</a>
      <a href="./private-messages.html" class="header-link">Tenant Messages</a>
      <a href="./codes.html" class="header-link">Codes</a>
      <a href="./stats.html" class="header-link">Stats</a>
    </div>
  </header>

  <div class="grid" id="templates-grid"></div>

  <section class="notes-section">
    <h2>Notes</h2>
    <div class="notes-card">
      <textarea class="notes-textarea" id="notes-textarea" placeholder="Add shared notes…"></textarea>
      <div class="notes-footer">
        <button class="notes-save-btn" id="notes-save-btn">Save</button>
        <button class="notes-copy-btn" id="notes-copy-btn" title="Copy notes"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCSWOHI6QLqugy_Fao2p4bBehg02_fu3No",
      authDomain: "padsplit-scrapper.firebaseapp.com",
      projectId: "padsplit-scrapper",
      storageBucket: "padsplit-scrapper.firebasestorage.app",
      messagingSenderId: "281696703679",
      appId: "1:281696703679:web:f94ba04e92cb43b4f9a20a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TEMPLATE_DOC = doc(db, "templates", "shared");
    const COUNT = 9;

    const textareas = [];
    const labels = [];

    function buildGrid() {
      const grid = document.getElementById('templates-grid');
      grid.innerHTML = '';
      textareas.length = 0;
      labels.length = 0;

      for (let i = 0; i < COUNT; i++) {
        const card = document.createElement('div');
        card.className = 'template-card';

        const label = document.createElement('div');
        label.className = 'template-label';
        label.contentEditable = 'true';
        label.spellcheck = false;
        label.dataset.index = i;
        label.textContent = `Template ${i + 1}`;
        labels.push(label);

        label.addEventListener('blur', async () => {
          const update = {};
          update[`n${i}`] = label.textContent.trim();
          await setDoc(TEMPLATE_DOC, update, { merge: true });
        });

        label.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            label.blur();
          }
        });

        const textarea = document.createElement('textarea');
        textarea.placeholder = `Template ${i + 1}…`;
        textareas.push(textarea);

        const footer = document.createElement('div');
        footer.className = 'card-footer';

        const saveBtn = document.createElement('button');
        saveBtn.className = 'save-btn';
        saveBtn.textContent = 'Save';
        saveBtn.addEventListener('click', async () => {
          saveBtn.textContent = 'Saving…';
          saveBtn.disabled = true;
          try {
            const update = {};
            update[`t${i}`] = textarea.value;
            await setDoc(TEMPLATE_DOC, update, { merge: true });
            saveBtn.textContent = 'Saved!';
          } catch (e) {
            saveBtn.textContent = 'Error';
          }
          setTimeout(() => { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1500);
        });

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.title = 'Copy to clipboard';
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(textarea.value).then(() => {
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 1500);
          });
        });

        footer.appendChild(saveBtn);
        footer.appendChild(copyBtn);
        card.appendChild(label);
        card.appendChild(textarea);
        card.appendChild(footer);
        grid.appendChild(card);
      }
    }

    buildGrid();

    // Real-time sync from Firestore
    onSnapshot(TEMPLATE_DOC, (snap) => {
      const data = snap.exists() ? snap.data() : {};
      textareas.forEach((ta, i) => {
        // Only update if not focused (don't clobber user mid-edit)
        if (document.activeElement !== ta) {
          ta.value = data[`t${i}`] ?? '';
        }
      });
      labels.forEach((lbl, i) => {
        if (document.activeElement !== lbl) {
          lbl.textContent = data[`n${i}`] || `Template ${i + 1}`;
        }
      });
    });

    // ── Notes ────────────────────────────────────────────────────────────────
    const NOTES_DOC = doc(db, 'notes', 'templates');
    const notesTA = document.getElementById('notes-textarea');
    const notesSave = document.getElementById('notes-save-btn');
    const notesCopy = document.getElementById('notes-copy-btn');
    onSnapshot(NOTES_DOC, snap => {
      if (snap.exists() && document.activeElement !== notesTA)
        notesTA.value = snap.data().text || '';
    });
    notesSave.addEventListener('click', async () => {
      notesSave.textContent = 'Saving…'; notesSave.disabled = true;
      try { await setDoc(NOTES_DOC, { text: notesTA.value }, { merge: true }); notesSave.textContent = 'Saved!'; }
      catch { notesSave.textContent = 'Error'; }
      setTimeout(() => { notesSave.textContent = 'Save'; notesSave.disabled = false; }, 1500);
    });
    notesCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(notesTA.value).then(() => {
        notesCopy.classList.add('copied');
        setTimeout(() => notesCopy.classList.remove('copied'), 1500);
      });
    });
  </script>
</body>
</html>
