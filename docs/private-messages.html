<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Tenant Messages — Private</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }
    .pill {
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(251,191,36,0.15);
      color: var(--warn);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .updated {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .filter-bar input {
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.3);
      background: #1e293b;
      color: var(--text);
      font-size: 0.9rem;
      flex: 1;
      min-width: 180px;
    }
    .filter-bar input::placeholder { color: var(--muted); }
    .count { color: var(--muted); font-size: 0.85rem; align-self: center; }
    .list { display: flex; flex-direction: column; gap: 0.65rem; }
    .card {
      background: #1e293b;
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 10px;
      padding: 0.85rem 1rem;
    }
    .card.unread { border-left: 3px solid var(--accent); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .tenant-name { font-weight: 600; font-size: 0.95rem; }
    .badge-unread {
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: rgba(56,189,248,0.18);
      color: var(--accent);
      white-space: nowrap;
    }
    .address { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.45rem; }
    .message-text { font-size: 0.9rem; line-height: 1.45; margin-bottom: 0.4rem; }
    .meta { font-size: 0.78rem; color: var(--muted); }
    .meta .sender { color: #94a3b8; }
    .thread { display: flex; flex-direction: column; gap: 0.45rem; margin-top: 0.4rem; }
    .thread-msg { font-size: 0.88rem; line-height: 1.5; padding: 0.3rem 0; border-bottom: 1px solid rgba(148,163,184,0.08); }
    .thread-msg:last-child { border-bottom: none; }
    .thread-msg .t-meta { font-size: 0.73rem; color: var(--muted); margin-top: 0.15rem; }
    .loading { text-align: center; padding: 3rem; color: var(--muted); }
    .error { color: #f87171; padding: 1rem; }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.82rem; }
    .notes-section { margin-top: 2rem; padding: 0 clamp(1rem,4vw,2.5rem); }
    .notes-section h2 { margin: 0 0 0.75rem; font-size: 1.2rem; }
    .notes-card { background: linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)); border: 1px solid rgba(148,163,184,.15); border-radius: 12px; padding: 1rem; }
    .notes-textarea { width: 100%; min-height: 120px; background: rgba(255,255,255,.04); border: 1px solid rgba(148,163,184,.2); border-radius: 8px; color: var(--text); font-family: inherit; font-size: .9rem; line-height: 1.5; padding: .65rem .75rem; resize: vertical; outline: none; transition: border-color .15s; box-sizing: border-box; }
    .notes-textarea:focus { border-color: var(--accent); }
    .notes-footer { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; margin-top: .5rem; }
    .notes-save-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: .8rem; padding: .3rem .65rem; transition: color .15s, border-color .15s; }
    .notes-save-btn:hover { color: #22c55e; border-color: #22c55e; }
    .notes-copy-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; padding: .3rem .5rem; display: flex; align-items: center; transition: color .15s, border-color .15s; }
    .notes-copy-btn:hover { color: #38bdf8; border-color: #38bdf8; }
    .notes-copy-btn.copied { color: #22c55e; border-color: #22c55e; }
    .notes-copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div id="gate-overlay" style="position:fixed;inset:0;z-index:100;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:2rem">
    <div style="max-width:380px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0));border:1px solid rgba(148,163,184,0.2);border-radius:12px;padding:1.5rem;box-shadow:0 14px 40px rgba(15,23,42,0.4)">
      <h2 style="margin:0 0 0.35rem;font-size:1.2rem;color:#e2e8f0">Sign In</h2>
      <p style="margin:0 0 1rem;color:#94a3b8;font-size:0.9rem">PadSplit Dashboard</p>
      <form id="gate-form" style="display:flex;flex-direction:column;gap:0.5rem">
        <input id="gate-email" type="email" placeholder="Email" autocomplete="email" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <input id="gate-password" type="password" placeholder="Password" autocomplete="current-password" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <button type="submit" style="border:none;border-radius:8px;background:#38bdf8;color:#0b1222;font-weight:700;padding:0.45rem 0.9rem;cursor:pointer;margin-top:0.25rem;font-family:inherit">Sign In</button>
      </form>
      <div id="gate-error" style="color:#f87171;font-size:0.9rem;margin-top:0.6rem;display:none">Incorrect email or password.</div>
    </div>
  </div>
  <header>
    <h1>Tenant Messages</h1>
    <span class="pill">PRIVATE</span>
    <div class="header-meta">
      <span class="updated" id="updated"></span>
      <a href="./index.html" class="header-link">Dashboard</a>
      <a href="./templates.html" class="header-link">Templates</a>
      <a href="./codes.html" class="header-link">Codes</a>
      <a href="./stats.html" class="header-link">Stats</a>
      <button id="signout-btn" class="header-link" style="background:none;border:none;cursor:pointer;padding:0">Sign out</button>
    </div>
  </header>

  <div class="filter-bar">
    <input id="search" type="search" placeholder="Filter by name, address, or message…" />
    <span class="count" id="count"></span>
  </div>

  <div id="list" class="list">
    <div class="loading">Loading…</div>
  </div>

  <section class="notes-section">
    <h2>Notes</h2>
    <div class="notes-card">
      <textarea class="notes-textarea" id="notes-textarea" placeholder="Add shared notes…"></textarea>
      <div class="notes-footer">
        <button class="notes-save-btn" id="notes-save-btn">Save</button>
        <button class="notes-copy-btn" id="notes-copy-btn" title="Copy notes"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </div>
  </section>

  <footer>Private view — not indexed by search engines. Source: <code>data/latest.json</code></footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCSWOHI6QLqugy_Fao2p4bBehg02_fu3No",
      authDomain: "padsplit-scrapper.firebaseapp.com",
      projectId: "padsplit-scrapper",
      storageBucket: "padsplit-scrapper.firebasestorage.app",
      messagingSenderId: "281696703679",
      appId: "1:281696703679:web:f94ba04e92cb43b4f9a20a"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    function fmtDate(s) {
      if (!s) return '—';
      const d = new Date(s);
      return isNaN(d.getTime()) ? s : d.toLocaleString();
    }

    let allMessages = [];

    function renderList(messages) {
      const list = document.getElementById('list');
      document.getElementById('count').textContent = `${messages.length} thread${messages.length !== 1 ? 's' : ''}`;
      if (!messages.length) {
        list.innerHTML = '<div class="loading">No matching threads.</div>';
        return;
      }
      list.innerHTML = '';
      messages.forEach(msg => {
        const unread = msg.member?.isUnread || msg.unread || (msg.unreadCount > 0);
        const tenantName = msg.title
          || msg.occupancy?.user?.firstName + ' ' + (msg.occupancy?.user?.lastName || '')
          || 'Unknown Tenant';
        const address = [
          msg.property?.address?.street1,
          msg.property?.address?.city?.name,
          msg.property?.address?.city?.state?.name,
        ].filter(Boolean).join(', ') || msg.property?.name || '—';
        const roomNumber = msg.occupancy?.room?.roomNumber;
        const addressLine = roomNumber != null ? `${address} — Room ${roomNumber}` : address;
        const card = document.createElement('div');
        card.className = 'card' + (unread ? ' unread' : '');
        card.innerHTML = `
          <div class="card-header">
            <span class="tenant-name">${tenantName.trim()}</span>
            ${unread ? '<span class="badge-unread">Unread</span>' : ''}
          </div>
          <div class="address">${addressLine}</div>
        `;

        const threadData = Array.isArray(msg.recent_messages) ? [...msg.recent_messages] : [];
        const filtered = threadData
          .filter(m => m && !m.deleted && (m.text ?? '').toString().trim() !== '')
          .sort((a, b) => new Date(a.created) - new Date(b.created));

        if (filtered.length) {
          const thread = document.createElement('div');
          thread.className = 'thread';
          filtered.forEach(m => {
            const senderLabel = (m.sender?.displayName || `${m.sender?.firstName || ''} ${m.sender?.lastName || ''}`).trim();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'thread-msg';
            msgDiv.innerHTML = `
              <div><strong>${senderLabel || 'Unknown'}:</strong> ${m.text}</div>
              <div class="t-meta">${fmtDate(m.created)}</div>
            `;
            thread.appendChild(msgDiv);
          });
          card.appendChild(thread);
        } else {
          const lastText = msg.lastMessage?.text || msg.lastMessage?.body || '(no text)';
          const lastDate = msg.lastMessage?.created || msg.lastMessage?.createdAt;
          const senderFirst = msg.lastMessage?.sender?.firstName || '';
          const senderDisplay = msg.lastMessage?.sender?.displayName || '';
          const senderLabel = senderDisplay || senderFirst || '';
          const msgTextDiv = document.createElement('div');
          msgTextDiv.className = 'message-text';
          msgTextDiv.textContent = lastText;
          card.appendChild(msgTextDiv);

          const metaDiv = document.createElement('div');
          metaDiv.className = 'meta';
          metaDiv.innerHTML = `${senderLabel ? `<span class="sender">${senderLabel} · </span>` : ''}${fmtDate(lastDate)}`;
          card.appendChild(metaDiv);
        }

        list.appendChild(card);
      });
    }

    function initApp() {
      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        if (!q) { renderList(allMessages); return; }
        renderList(allMessages.filter(msg => {
          const name = (msg.title || '').toLowerCase();
          const addr = (msg.property?.address?.street1 || '').toLowerCase();
          const text = (msg.lastMessage?.text || msg.lastMessage?.body || '').toLowerCase();
          const room = String(msg.occupancy?.room?.roomNumber ?? '');
          return name.includes(q) || addr.includes(q) || text.includes(q) || room.includes(q);
        }));
      });

      fetch('./data/latest.json', { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(data => {
          document.getElementById('updated').textContent = `Updated ${fmtDate(data.scraped_at)}`;
          allMessages = (data.messages || []).sort((a, b) => {
            const ta = new Date(a.lastMessage?.created || 0);
            const tb = new Date(b.lastMessage?.created || 0);
            return tb - ta;
          });
          renderList(allMessages);
        })
        .catch(err => {
          document.getElementById('list').innerHTML =
            `<div class="error">Failed to load latest.json: ${err.message}</div>`;
        });

      const NOTES_DOC = doc(db, 'notes', 'messages');
      const ta = document.getElementById('notes-textarea');
      const saveBtn = document.getElementById('notes-save-btn');
      const copyBtn = document.getElementById('notes-copy-btn');
      onSnapshot(NOTES_DOC, snap => { if (snap.exists() && document.activeElement !== ta) ta.value = snap.data().text || ''; });
      saveBtn.addEventListener('click', async () => {
        saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;
        try { await setDoc(NOTES_DOC, { text: ta.value }, { merge: true }); saveBtn.textContent = 'Saved!'; }
        catch { saveBtn.textContent = 'Error'; }
        setTimeout(() => { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1500);
      });
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(ta.value).then(() => { copyBtn.classList.add('copied'); setTimeout(() => copyBtn.classList.remove('copied'), 1500); });
      });
    }

    const gateOverlay = document.getElementById('gate-overlay');
    const gateForm = document.getElementById('gate-form');
    const gateError = document.getElementById('gate-error');

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('gate-email').value.trim(), document.getElementById('gate-password').value);
        gateError.style.display = 'none';
      } catch (err) {
        console.error(err);
        gateError.style.display = 'block';
      }
    });

    let appInited = false;
    onAuthStateChanged(auth, (user) => {
      if (user) {
        gateOverlay.style.display = 'none';
        if (!appInited) { appInited = true; initApp(); }
      } else {
        gateOverlay.style.display = 'flex';
      }
    });

    document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));
  </script>
</body>
</html>
