<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="padsplit-data-mode" content="api"><title>Tasks · Operations</title>
<link rel="stylesheet" href="./operations-tokens.css"><link rel="stylesheet" href="./operations.css"><link rel="stylesheet" href="./team.css">
<script src="./runtime-config.js"></script><script src="./vendors-api.js"></script><script src="./api-client.js"></script><script src="./tasks-api.js"></script><script defer src="./navigation.js"></script>
</head>
<body>
<nav class="ops-nav" aria-label="Main navigation"></nav>
<header class="team-header"><div><p class="eyebrow">Operations</p><h1>Tasks</h1><p>Manage property tasks and internal discussions.</p></div><button id="tasks-signout" type="button" hidden>Sign out</button></header>
<main class="team-main">
<section id="tasks-gate" class="team-panel"><h2>Sign in</h2><p id="tasks-gate-status" role="status">Checking configuration…</p><form id="tasks-signin" hidden><label>Email <input id="tasks-email" type="email" autocomplete="username" required></label><label>Password <input id="tasks-password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><button id="tasks-another" type="button" hidden>Use another account</button></section>
<div id="tasks-workspace" hidden><p id="tasks-status" role="status" aria-live="polite"></p><div class="team-columns">
<section class="team-panel"><div class="team-panel-heading"><h2>Tasks</h2><button type="button" id="tasks-refresh">Refresh</button></div><div id="tasks-list"></div><button type="button" id="tasks-more" hidden>Load more</button>
<form id="task-create-form"><h3>Add task</h3><label>Property <select id="task-property" required></select></label><label>Title <input id="task-new-title" maxlength="200" required></label><button type="submit">Add task</button></form></section>
<section class="team-panel"><h2>Task details</h2><p id="task-empty">Choose a task.</p><div id="task-detail" hidden><form id="task-edit-form"><label>Title <textarea id="task-title" aria-describedby="task-title-limit" required></textarea></label><p id="task-title-limit" role="status"></p><label>Status <select id="task-state"><option value="open">Open</option><option value="in_progress">In progress</option><option value="done">Done</option></select></label><button type="submit">Save changes</button></form><button type="button" id="task-delete">Delete task</button><h3>Discussion</h3><div id="task-discussions"></div><button id="discussion-more" type="button" hidden>Load more discussions</button><form id="discussion-form"><label>Role label <select id="discussion-role"><option value="">No label</option><option value="Don">Don</option><option value="Repairman #1">Repairman #1</option><option value="Repairman #2">Repairman #2</option><option value="Owner">Owner</option><option value="Manager">Manager</option></select></label><label>Status label <select id="discussion-status"><option value="">No label</option><option value="Done">Done</option><option value="In Process">In Process</option><option value="Can't get to it for a bit...">Can't get to it for a bit...</option></select></label><small>Labels describe the update; your signed-in account is recorded as the author.</small><label>Message <textarea id="discussion-body" maxlength="10000" required></textarea></label><button type="submit">Post message</button></form></div></section>
</div></div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const gate=document.getElementById('tasks-gate'),gateStatus=document.getElementById('tasks-gate-status'),signin=document.getElementById('tasks-signin'),password=document.getElementById('tasks-password'),panel=document.getElementById('tasks-workspace'),signout=document.getElementById('tasks-signout'),another=document.getElementById('tasks-another');
let runtime;try{runtime=resolveOperationsRuntime(window.PADSPLIT_RUNTIME_CONFIG,true);if(runtime.mode!=='api')throw Error();}catch{gateStatus.textContent='Private task service is not configured.';throw Error('Task service unavailable.');}
const auth=getAuth(initializeApp(runtime.firebase)),api=createOperationsApi({baseUrl:runtime.apiOrigin,getUser:()=>auth.currentUser});let workspace=null,generation=0;
window.addEventListener('beforeunload',event=>{if(workspace?.isDirty()){event.preventDefault();event.returnValue='';}});
function clear(message){generation++;workspace?.stop();workspace=null;api.clearSession();panel.hidden=true;gate.hidden=false;signin.hidden=true;signout.hidden=true;another.hidden=false;gateStatus.textContent=message;}
signin.addEventListener('submit',async event=>{event.preventDefault();const button=signin.querySelector('button');button.disabled=true;try{await signInWithEmailAndPassword(auth,document.getElementById('tasks-email').value.trim(),password.value);}catch{gateStatus.textContent='Sign in could not be confirmed.';}finally{password.value='';button.disabled=false;}});
signout.addEventListener('click',()=>signOut(auth));another.addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,user=>{generation++;const current=generation;workspace?.stop();workspace=null;api.clearSession();panel.hidden=true;gate.hidden=false;signout.hidden=true;password.value='';if(!user){signin.hidden=false;another.hidden=true;gateStatus.textContent='Sign in with an authorized account.';return;}signin.hidden=true;another.hidden=false;gateStatus.textContent='Checking account access…';const initialTaskId=new URLSearchParams(window.location.hash.slice(1)).get('task');const candidate=createTasksWorkspace({api,document,getUid:()=>auth.currentUser?.uid,isCurrent:()=>generation===current&&auth.currentUser===user,onAccessLost:()=>clear('Account access expired or was revoked.'),confirmChange:message=>window.confirm(message),initialTaskId});workspace=candidate;candidate.start().then(()=>{if(current!==generation||auth.currentUser!==user)return;gate.hidden=true;another.hidden=true;panel.hidden=false;signout.hidden=false;}).catch(()=>{if(current!==generation)return;candidate.stop();workspace=null;gateStatus.textContent='Task access could not be verified.';});});
</script>
</body></html>
