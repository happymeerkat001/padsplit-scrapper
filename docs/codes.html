<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadSplit Codes</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --error: #f87171;
      --text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(34,197,94,0.08), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 14px 40px rgba(15,23,42,0.4);
    }
    .muted { color: var(--muted); }
    .error { color: var(--error); font-size: 0.9rem; }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }
    details {
      margin-top: 0.85rem;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.015);
    }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(148,163,184,0.14);
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    .property-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .save-btn {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      min-width: 86px;
    }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved {
      background: var(--success);
      color: #05220f;
    }
    .property-body {
      padding: 0.85rem 1rem 1rem;
    }
    .section-label {
      margin: 0.9rem 0 0.4rem;
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      table-layout: fixed;
    }
    td {
      padding: 0.35rem 0.45rem;
      border-bottom: 1px solid rgba(148,163,184,0.08);
      vertical-align: middle;
    }
    td:first-child {
      width: 34%;
      color: var(--muted);
      font-weight: 500;
    }
    .code-input {
      width: 100%;
      background: #0b1222;
      border: 1px solid rgba(148,163,184,0.35);
      color: var(--text);
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
    }
    #gate-wrap {
      max-width: 430px;
      margin: 12vh auto 0;
    }
    #app-wrap { max-width: 1200px; margin: 0 auto; }
    .gate-title { margin-top: 0; margin-bottom: 0.35rem; }
    .gate-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .gate-form input {
      flex: 1;
      min-width: 180px;
      background: #0b1222;
      border: 1px solid rgba(148,163,184,0.35);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
    }
    .gate-form button {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }
    .hidden { display: none; }
    .shake {
      animation: shake 240ms linear 2;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

    const gateWrap = document.getElementById('gate-wrap');

    const gateError = document.getElementById('gate-error');
    const list = document.getElementById('codes-list');

    function showApp() {
      gateWrap.classList.add('hidden');
      appWrap.classList.remove('hidden');
      initCodes().catch((err) => {
        console.error(err);
        list.innerHTML = '<div class="error" style="margin-top:1rem">Failed to load codes from Firestore.</div>';
      });
    }

    function showGate() {
      gateWrap.classList.remove('hidden');
      appWrap.classList.add('hidden');
      gateInput.focus();
    }

    gateForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (gateInput.value === '9999') {
        sessionStorage.setItem('codes_auth', '1');
        gateError.classList.add('hidden');
        showApp();
        return;
      }
      gateError.classList.remove('hidden');
      gateWrap.classList.remove('shake');
      void gateWrap.offsetWidth;
      gateWrap.classList.add('shake');
      gateInput.select();
    });

    function renderProperty(property, savedValues = {}) {
      const details = document.createElement('details');
      details.open = true;
      const summary = document.createElement('summary');
      summary.innerHTML = `
        <div class="flex-between">
          <div class="property-title">${property.address}</div>
          <button type="button" class="save-btn" data-save="${property.slug}">Save</button>
        </div>
      `;
      details.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'property-body';

      property.sections.forEach((section) => {
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = section.label;
        body.appendChild(label);

        const table = document.createElement('table');
        const tbody = document.createElement('tbody');

        section.fields.forEach((field) => {
          const tr = document.createElement('tr');
          const tdLabel = document.createElement('td');
          tdLabel.textContent = field.label;
          const tdInput = document.createElement('td');
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'code-input';
          input.dataset.prop = property.slug;
          input.dataset.field = field.key;
          input.value = Object.prototype.hasOwnProperty.call(savedValues, field.key)
            ? savedValues[field.key]
            : field.value;
          tdInput.appendChild(input);
          tr.appendChild(tdLabel);
          tr.appendChild(tdInput);
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        body.appendChild(table);
      });

      details.appendChild(body);
      return details;
    }

    async function initCodes() {
      const snapshot = await getDocs(collection(db, 'property_codes'));
      const docsBySlug = new Map();
      snapshot.forEach((d) => docsBySlug.set(d.id, d.data()));

      list.innerHTML = '';
      DEFAULTS.forEach((property) => {
        const node = renderProperty(property, docsBySlug.get(property.slug) || {});
        list.appendChild(node);
      });

      list.querySelectorAll('.save-btn').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const slug = btn.dataset.save;
          const inputs = list.querySelectorAll(`input[data-prop="${slug}"]`);
          const payload = {};
          inputs.forEach((input) => {
            payload[input.dataset.field] = input.value.trim();
          });
          btn.disabled = true;
          const oldText = btn.textContent;
          try {
            await setDoc(doc(db, 'property_codes', slug), {
              ...payload,
              updatedAt: serverTimestamp()
            }, { merge: true });
            btn.textContent = 'Saved ✓';
            btn.classList.add('saved');
            setTimeout(() => {
              btn.textContent = 'Save';
              btn.classList.remove('saved');
            }, 1500);
          } catch (err) {
            console.error('Failed to save codes', err);
            btn.textContent = 'Error';
            setTimeout(() => {
              btn.textContent = oldText;
            }, 1500);
          } finally {
            setTimeout(() => { btn.disabled = false; }, 200);
          }
        });
      });
    }

    if (sessionStorage.getItem('codes_auth') === '1') {
      showApp();
    } else {
      showGate();
    }

</html>
