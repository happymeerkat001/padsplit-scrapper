      min-height: 100vh;

      display: flex;
      flex-wrap: wrap;

      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 14px 40px rgba(15,23,42,0.4);
    }
    .muted { color: var(--muted); }
    .error { color: var(--error); font-size: 0.9rem; }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }
    details {
      margin-top: 0.85rem;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.015);
    }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(148,163,184,0.14);
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    .property-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .save-btn {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      min-width: 86px;
    }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved {
      background: var(--success);
      color: #05220f;
    }
    .property-body {
      padding: 0.85rem 1rem 1rem;
    }
    .section-label {
      margin: 0.9rem 0 0.4rem;
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      table-layout: fixed;
    }
    th {
      padding: 0.35rem 0.45rem;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-align: left;
      border-bottom: 1px solid rgba(148,163,184,0.14);
    }
    td {
      padding: 0.35rem 0.45rem;
      border-bottom: 1px solid rgba(148,163,184,0.08);
      vertical-align: middle;
    }
    td:first-child {
      width: 34%;
      color: var(--muted);
      font-weight: 500;
    }
    table.room-table td:first-child,
    table.room-table th:first-child {
      width: 22%;
    }
    .code-input {
      width: 100%;
      background: #0b1222;
      border: 1px solid rgba(148,163,184,0.35);
      color: var(--text);
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
    }

      background: #fff5f5;
      color: #7f1d1d;
    }

      max-width: 430px;

      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;

      border: 1px solid rgba(148,163,184,0.35);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
    }

      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.45rem 0.9rem;

    }
    .hidden { display: none; }
    .shake {
      animation: shake 240ms linear 2;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

            { label: "R4", door: { key: "r4", value: "456090" }, lockbox: { key: "lockbox_4", value: "4321" } },
            { label: "R5", door: { key: "r5", value: "504530" }, lockbox: { key: "lockbox_5", value: "5220" } },
            { label: "R6", door: { key: "r6", value: "313131" }, lockbox: { key: "lockbox_6", value: "6111" } },
            { label: "R7", door: { key: "r7", value: "121212" }, lockbox: { key: "lockbox_7", value: "7222" } }
          ]},
          { label: "Contact", fields: [
            { key: "responsible_tenant", label: "Responsible Tenant", value: "", placeholder: "Name, Phone" },
            { key: "ac_filter_date", label: "AC Filter", value: "", type: "date" }
          ]}
        ]
      },
      {
        slug: "broken_crest_1025",
        address: "1025 Broken Crest, Desoto",
        sections: [
          { label: "Door Codes", fields: [
            { key: "front_door", label: "Front", value: "225577 (format: 22-55-77?)" },
            { key: "thermo", label: "Thermo", value: "3838" }
          ]},
          { label: "WiFi", fields: [
            { key: "wifi_primary", label: "Spectrum", value: "SpectrumSetup-A402 / distinctbase477" }
          ]},
          { label: "Rooms", fields: [
            { label: "R1", door: { key: "r1", value: "9119 (lockbox)" }, lockbox: { key: "lockbox_1", value: "" } },
            { label: "R2", door: { key: "r2", value: "0079 (lockbox)" }, lockbox: { key: "lockbox_2", value: "" } },
            { label: "R3", door: { key: "r3", value: "7633 (lockbox)" }, lockbox: { key: "lockbox_3", value: "" } },
            { label: "R4", door: { key: "r4", value: "1717" }, lockbox: { key: "lockbox_4", value: "" } },
            { label: "R5", door: { key: "r5", value: "6964" }, lockbox: { key: "lockbox_5", value: "" } },
            { label: "R6", door: { key: "r6", value: "5376" }, lockbox: { key: "lockbox_6", value: "" } },
            { label: "R7", door: { key: "r7", value: "2573" }, lockbox: { key: "lockbox_7", value: "" } },
            { label: "R8", door: { key: "r8", value: "6553" }, lockbox: { key: "lockbox_8", value: "" } },
            { label: "R9", door: { key: "r9", value: "4554" }, lockbox: { key: "lockbox_9", value: "" } }
          ]},
          { label: "Contact", fields: [
            { key: "responsible_tenant", label: "Responsible Tenant", value: "", placeholder: "Name, Phone" },
            { key: "ac_filter_date", label: "AC Filter", value: "", type: "date" }
          ]}
        ]
      }
    ];

    const gateWrap = document.getElementById('gate-wrap');
    const appWrap = document.getElementById('app-wrap');
    const gateForm = document.getElementById('gate-form');
    const gateInput = document.getElementById('gate-input');
    const gateError = document.getElementById('gate-error');
    const list = document.getElementById('codes-list');

    function showApp() {
      gateWrap.classList.add('hidden');
      appWrap.classList.remove('hidden');
      initCodes().catch((err) => {
        console.error(err);
        list.innerHTML = '<div class="error" style="margin-top:1rem">Failed to load codes from Firestore.</div>';
      });
    }

    function showGate() {
      gateWrap.classList.remove('hidden');
      appWrap.classList.add('hidden');
      gateInput.focus();
    }

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('gate-email').value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, gateInput.value);
        gateError.classList.add('hidden');
      } catch (err) {
        console.error(err);
        gateError.classList.remove('hidden');
        gateWrap.classList.remove('shake');
        void gateWrap.offsetWidth;
        gateWrap.classList.add('shake');
        gateInput.select();
      }
    });

    function updateAcFilterOverdueState(input) {
      if (input.dataset.field !== 'ac_filter_date') return;
      input.classList.remove('overdue');
      if (!input.value) return;
      const ageMs = Date.now() - new Date(input.value).getTime();
      const threeMonthsMs = 90 * 24 * 60 * 60 * 1000;
      if (ageMs > threeMonthsMs) input.classList.add('overdue');
    }

    function fieldValue(savedValues, key, fallback) {
      return Object.prototype.hasOwnProperty.call(savedValues, key)
        ? savedValues[key]
        : fallback;
    }

    function createCodeInput(propertySlug, field, savedValues, ariaLabel) {
      const input = document.createElement('input');
      input.type = field.type || 'text';
      input.className = 'code-input';
      input.dataset.prop = propertySlug;
      input.dataset.field = field.key;
      input.value = fieldValue(savedValues, field.key, field.value);
      input.setAttribute('aria-label', ariaLabel);
      updateAcFilterOverdueState(input);
      input.addEventListener('input', () => updateAcFilterOverdueState(input));
      if (field.placeholder) input.placeholder = field.placeholder;
      return input;
    }

    function renderSimpleTable(property, section, savedValues) {
      const table = document.createElement('table');
      const tbody = document.createElement('tbody');
      section.fields.forEach((field) => {
        const tr = document.createElement('tr');
        const tdLabel = document.createElement('td');
        tdLabel.textContent = field.label;
        const tdInput = document.createElement('td');
        tdInput.appendChild(createCodeInput(property.slug, field, savedValues, field.label));
        tr.appendChild(tdLabel);
        tr.appendChild(tdInput);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    function renderRoomsTable(property, section, savedValues) {
      const table = document.createElement('table');
      table.className = 'room-table';
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      ['Room', 'Door code', 'Lockbox'].forEach((text) => {
        const th = document.createElement('th');
        th.scope = 'col';
        th.textContent = text;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      section.fields.forEach((field) => {
        const tr = document.createElement('tr');
        const tdLabel = document.createElement('td');
        tdLabel.textContent = field.label;
        const tdDoor = document.createElement('td');
        tdDoor.appendChild(createCodeInput(
          property.slug, field.door, savedValues, `${field.label} door code`
        ));
        const tdBox = document.createElement('td');
        tdBox.appendChild(createCodeInput(
          property.slug, field.lockbox, savedValues, `${field.label} lockbox`
        ));
        tr.appendChild(tdLabel);
        tr.appendChild(tdDoor);
        tr.appendChild(tdBox);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    function renderProperty(property, savedValues = {}) {
      const details = document.createElement('details');
      details.open = true;
      const summary = document.createElement('summary');
      summary.innerHTML = `
        <div class="flex-between">
          <div class="property-title">${property.address}</div>
          <button type="button" class="save-btn" data-save="${property.slug}">Save</button>
        </div>
      `;
      details.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'property-body';

      property.sections.forEach((section) => {
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = section.label;
        body.appendChild(label);
        const table = section.label === "Rooms"
          ? renderRoomsTable(property, section, savedValues)
          : renderSimpleTable(property, section, savedValues);
        body.appendChild(table);
      });

      details.appendChild(body);
      return details;
    }

    async function initCodes() {
      const snapshot = await getDocs(collection(db, 'property_codes'));
      const docsBySlug = new Map();
      snapshot.forEach((d) => docsBySlug.set(d.id, d.data()));

      list.innerHTML = '';
      DEFAULTS.forEach((property) => {
        const node = renderProperty(property, docsBySlug.get(property.slug) || {});
        list.appendChild(node);
      });

      list.querySelectorAll('.save-btn').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const slug = btn.dataset.save;
          const inputs = list.querySelectorAll(`input[data-prop="${slug}"]`);
          const payload = {};
          inputs.forEach((input) => {
            payload[input.dataset.field] = input.value.trim();
          });
          btn.disabled = true;
          const oldText = btn.textContent;
          try {
            await setDoc(doc(db, 'property_codes', slug), {
              ...payload,
              updatedAt: serverTimestamp()
            }, { merge: true });
            btn.textContent = 'Saved ✓';
            btn.classList.add('saved');
            setTimeout(() => {
              btn.textContent = 'Save';
              btn.classList.remove('saved');
            }, 1500);
          } catch (err) {
            console.error('Failed to save codes', err);
            btn.textContent = 'Error';
            setTimeout(() => {
              btn.textContent = oldText;
            }, 1500);
          } finally {
            setTimeout(() => { btn.disabled = false; }, 200);
          }
        });
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (user) showApp();
      else showGate();
    });
    document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

    // ── Notes ────────────────────────────────────────────────────────────────
    const NOTES_DOC = doc(db, 'notes', 'codes');
    const notesTA = document.getElementById('notes-textarea');
    const notesSave = document.getElementById('notes-save-btn');
    const notesCopy = document.getElementById('notes-copy-btn');
    onSnapshot(NOTES_DOC, snap => {
      if (snap.exists() && document.activeElement !== notesTA)
        notesTA.value = snap.data().text || '';
    });
    notesSave.addEventListener('click', async () => {
      notesSave.textContent = 'Saving…'; notesSave.disabled = true;
      try { await setDoc(NOTES_DOC, { text: notesTA.value }, { merge: true }); notesSave.textContent = 'Saved!'; }
      catch { notesSave.textContent = 'Error'; }
      setTimeout(() => { notesSave.textContent = 'Save'; notesSave.disabled = false; }, 1500);
    });
    notesCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(notesTA.value).then(() => {
        notesCopy.classList.add('copied');
        setTimeout(() => notesCopy.classList.remove('copied'), 1500);
      });
    });
  </script>
</body>
