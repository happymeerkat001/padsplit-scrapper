      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --error: #f87171;
      --text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 35%),

      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 14px 40px rgba(15,23,42,0.4);
    }
    .muted { color: var(--muted); }
    .error { color: var(--error); font-size: 0.9rem; }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }
    details {
      margin-top: 0.85rem;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.015);
    }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(148,163,184,0.14);
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    .property-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .save-btn {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      min-width: 86px;
    }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved {
      background: var(--success);
      color: #05220f;
    }
    .save-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      align-self: flex-start;
    }
    .edit-btn, .confirm-cancel {
      border: 1px solid rgba(148,163,184,0.4);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-weight: 600;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
    }
    .confirm-save {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      cursor: pointer;

    .save-confirm {

      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
    }
    .save-confirm.hidden { display: none; }
    .discard-prompt {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.72);
      padding: 1rem;

    .discard-prompt p {

    }
    .discard-prompt-actions {

    .discard-prompt-card {

      padding: 1rem;

      font-size: 0.75rem;
      line-height: 1.35;

      color: var(--muted);
      font-weight: 600;
      padding: 0.4rem 0.75rem;
      cursor: pointer;

    .history-panel {

      padding: 0.75rem;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 8px;

      background: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0.25rem 0;
      display: block;
      text-align: left;

      table-layout: fixed;
    }

      border-bottom: 1px solid rgba(148,163,184,0.08);

    }

      color: var(--muted);
      font-weight: 500;

    table.multi-col th {

      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.4rem 0.45rem 0.5rem;
      border-bottom: 1px solid rgba(148,163,184,0.2);
      white-space: nowrap;

      color: var(--text);
      font-weight: 600;
      white-space: nowrap;

      padding: 0.25rem 0.4rem;

      background: #fff5f5;

      25% { transform: translateX(-4px); }

    function resolveSavedOrDefault(savedValues, key, _fallback = '') {
      if (!currentHasLiveDoc) return '';

      return value == null ? '' : String(value);

    const HISTORY_RESERVED = ['updatedAt', 'contentHash', 'source', 'expireAt', 'createdAt', 'fields'];

    function canonicalizeCodeFields(data) {
      const out = {};
      Object.keys(data || {}).sort().forEach((key) => {
        if (HISTORY_RESERVED.includes(key)) return;
        const value = data[key];
        out[key] = value == null ? '' : String(value);
      });
      return out;
    }

    async function hashCodeFields(data) {
      const blob = JSON.stringify(canonicalizeCodeFields(data));
      const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(blob));
      return [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function updateDateOverdueState(input) {
      const days = OVERDUE_DAYS[input.dataset.field];
      input.classList.remove('overdue');
      if (!days || !input.value) return;
      const parsed = new Date(input.value);
      if (Number.isNaN(parsed.getTime())) return;
      const ageMs = Date.now() - parsed.getTime();
      if (ageMs > days * 24 * 60 * 60 * 1000) input.classList.add('overdue');
    }

    function createFieldInput(property, fieldKey, value, options = {}) {
      const isTextarea = options.type === 'textarea';
      const input = document.createElement(isTextarea ? 'textarea' : 'input');
      if (!isTextarea) input.type = options.type || 'text';
      input.className = isTextarea ? 'code-input code-textarea' : 'code-input';
      input.dataset.prop = property.slug;
      input.dataset.field = fieldKey;
      input.value = value;
      input.readOnly = true;
      if (options.placeholder) input.placeholder = options.placeholder;
      if (isTextarea) input.rows = options.rows || 3;
      updateDateOverdueState(input);
      input.addEventListener('input', () => updateDateOverdueState(input));
      return input;
    }

        const before = baseline && baseline[key] != null ? String(baseline[key]).trim() : '';
        const after = current[key] == null ? '' : String(current[key]).trim();

    function formatSavedTime(date) {
      const when = date instanceof Date ? date : new Date();
      let hour = when.getHours();
      const minute = String(when.getMinutes()).padStart(2, '0');
      const suffix = hour >= 12 ? 'pm' : 'am';
      hour %= 12;
      if (hour === 0) hour = 12;
      return `saved ${hour}:${minute}${suffix}`;
    }

    function updatedAtToken(value) {
      if (value == null || value === '') return '';
      if (typeof value.toMillis === 'function') return `ms:${value.toMillis()}`;
      if (typeof value === 'object' && typeof value.seconds === 'number') {
        const nanos = typeof value.nanoseconds === 'number' ? value.nanoseconds : 0;
        return `ts:${value.seconds}.${nanos}`;
      }
      if (typeof value === 'string' || typeof value === 'number') return `v:${value}`;
      return `o:${String(value)}`;
    }

    function sameUpdatedAt(loaded, current) {
      return updatedAtToken(loaded) === updatedAtToken(current);

      const card = doc.createElement('div');
      card.className = 'discard-prompt-card';
      const line = doc.createElement('p');
      line.className = 'discard-prompt-line';
      line.textContent = discardPromptCopy(houseName);
      const actions = doc.createElement('div');
      actions.className = 'discard-prompt-actions';
      const keep = doc.createElement('button');
      keep.type = 'button';
      keep.className = 'discard-keep';
      keep.textContent = 'keep editing';
      const discardBtn = doc.createElement('button');
      discardBtn.type = 'button';
      discardBtn.className = 'discard-go';
      discardBtn.textContent = 'discard';
      actions.appendChild(keep);
      actions.appendChild(discardBtn);
      card.appendChild(line);
      card.appendChild(actions);
      wrap.appendChild(card);
      (doc.body || doc).appendChild(wrap);
      keep.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        keep.click();
      });
      keep.focus();
      return { wrap, keep, discard: discardBtn, line };
    }

    function rememberHouseLoad(slug, data) {
      const saved = data && typeof data === 'object' ? data : {};
      baselineBySlug.set(slug, canonicalizeCodeFields(saved));
      loadedUpdatedAtBySlug.set(slug, saved.updatedAt == null ? null : saved.updatedAt);
    }
    // end save-flow helpers

    async function initCodes(generation) {
      const isCodesUser = () => isApprovedCodesUser(auth.currentUser);

      const liveRef = (slug) => doc(db, 'property_codes', slug);
      const versionsCol = (slug) => collection(db, 'property_codes', slug, 'code_versions');

      async function writeSnapshot(slug, live, source) {
        const fields = canonicalizeCodeFields(live);
        await setDoc(doc(versionsCol(slug)), {
          fields,
          contentHash: await hashCodeFields(live),
          createdAt: serverTimestamp(),
          expireAt: Timestamp.fromMillis(Date.now() + 90 * 24 * 60 * 60 * 1000),
          source
        });
      }

      function collectForm(slug) {
        const payload = {};
        list.querySelectorAll(`input[data-prop="${slug}"], textarea[data-prop="${slug}"]`).forEach((input) => {
          payload[input.dataset.field] = input.value.trim();
        });
        return payload;
      }

      async function refreshHouse(slug) {
        const property = DEFAULTS.find((item) => item.slug === slug);
        if (!property) return;
        const snap = await getDoc(liveRef(slug));
        const hasLive = snap.exists();
        const data = hasLive ? snap.data() : {};
        rememberHouseLoad(slug, data);
        const node = renderProperty(property, data, hasLive);
        const old = list.querySelector(`details[data-house="${slug}"]`);
        if (old) old.replaceWith(node);
        else list.appendChild(node);
        if (editingSlug === slug) editingSlug = null;
        bindHouse(node, slug, property.address);
      }

      function formatWhen(value) {
        if (!value) return 'unknown time';
        if (typeof value.toDate === 'function') return value.toDate().toLocaleString();
        return String(value);
      }

      function historyOpts(panel) {
        return panel.id === 'page-history-panel'
          ? { onHouses: () => renderHousePicker(panel) }
          : {};
      }

      function appendHousesBack(panel, onHouses) {
        const back = document.createElement('button');
        back.type = 'button';
        back.className = 'history-cancel';
        back.textContent = 'Houses';
        back.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          onHouses();
        });
        panel.appendChild(back);
      }

      function renderHousePicker(panel) {
        panel.innerHTML = '';
        DEFAULTS.forEach((property) => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'history-row';
          row.textContent = property.address;
          row.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            try {
              await loadHistory(panel, property.slug, property.address, historyOpts(panel));
            } catch (err) {
              console.error(err);
              panel.textContent = 'Could not load history.';
            }
          });
          panel.appendChild(row);
        });
      }

      async function loadHistory(panel, slug, address, opts = {}) {
        const cursor = opts.cursor || null;
        const onHouses = opts.onHouses || null;
        if (!cursor) panel.innerHTML = '';
        if (!isCodesUser() || slug === 'spanish_moss') {
          panel.textContent = 'History is unavailable.';
          return;
        }
        const q = cursor
          ? query(versionsCol(slug), orderBy('createdAt', 'desc'), startAfter(cursor), limit(50))
          : query(versionsCol(slug), orderBy('createdAt', 'desc'), limit(50));
        const snap = await getDocs(q);
        if (!cursor && snap.empty) {
          panel.innerHTML = '';
          const note = document.createElement('div');
          note.className = 'muted';
          note.textContent = 'No previous codes yet. Snapshots start after a Save or the daily Mac catch-up.';
          panel.appendChild(note);
          if (onHouses) appendHousesBack(panel, onHouses);
          return;
        }
        if (!cursor && onHouses) appendHousesBack(panel, onHouses);
        snap.docs.forEach((item) => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'history-row';
          row.textContent = formatWhen(item.data().createdAt);
          row.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showVersion(panel, slug, address, item.id, item.data());
          });
          panel.appendChild(row);
        });
        const oldOlder = panel.querySelector('.history-older');
        if (oldOlder) oldOlder.remove();
        if (snap.docs.length === 50) {
          const older = document.createElement('button');
          older.type = 'button';
          older.className = 'history-row history-older';
          older.textContent = 'Older';
          older.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            loadHistory(panel, slug, address, { cursor: snap.docs[snap.docs.length - 1], onHouses });
          });
          panel.appendChild(older);
        }
      }

      function showVersion(panel, slug, address, versionId, data) {
        const fields = data.fields || {};
        const when = formatWhen(data.createdAt);
        const preview = document.createElement('div');
        preview.className = 'history-preview';
        preview.textContent = Object.keys(fields).sort().map((key) => `${key}: ${fields[key]}`).join('\n');
        const actions = document.createElement('div');
        actions.className = 'history-actions';
        const restoreBtn = document.createElement('button');
        restoreBtn.type = 'button';
        restoreBtn.className = 'history-restore';
        restoreBtn.textContent = 'Restore';
        restoreBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          restoreLiveCodes(slug, address, versionId, when, panel);
        });
        const cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'history-cancel';
        cancel.textContent = 'Back';
        cancel.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          loadHistory(panel, slug, address, historyOpts(panel));
        });
        panel.innerHTML = '';
        panel.appendChild(preview);
        actions.appendChild(restoreBtn);
        actions.appendChild(cancel);
        panel.appendChild(actions);
      }

      async function restoreLiveCodes(slug, address, versionId, when, panel) {
        const confirmCopy = `Restore ${address} from ${when}? This deletes live keys that are not in that snapshot. Unsaved edits for this house are lost.`;
        if (!window.confirm(confirmCopy)) return;
        if (!isCodesUser()) return;
        try {
          const before = await getDoc(liveRef(slug));
          const live = before.exists() ? before.data() : {};
          const beforeHash = await hashCodeFields(live);
          await writeSnapshot(slug, live, 'page');
          const version = await getDoc(doc(db, 'property_codes', slug, 'code_versions', versionId));
          if (!version.exists()) {
            panel.textContent = 'That snapshot is gone.';
            return;
          }
          const still = await getDoc(liveRef(slug));
          const stillHash = await hashCodeFields(still.exists() ? still.data() : {});
          if (stillHash !== beforeHash) {
            panel.textContent = 'Live codes changed. Restore cancelled.';
            return;
          }
          const saveBtn = list.querySelector(`button[data-save="${slug}"]`);
          if (saveBtn) saveBtn.disabled = true;
          await setDoc(liveRef(slug), {
            ...canonicalizeCodeFields(version.data().fields || {}),
            updatedAt: serverTimestamp()
          });
          await refreshHouse(slug);
        } catch (err) {
          console.error('Failed to restore codes', err);
          panel.textContent = 'Restore failed. Live codes were not changed.';
        }
      }

      function houseNode(slug) {
        return list.querySelector(`details[data-house="${slug}"]`);
      }

      function fieldsOf(slug) {
        return [...list.querySelectorAll(`input[data-prop="${slug}"], textarea[data-prop="${slug}"]`)];
      }

      function setSaveStatus(slug, message) {
        const node = houseNode(slug);
        const status = node && node.querySelector('.save-status');
        if (status) status.textContent = message || '';
      }

      function setHouseEditing(slug, on) {
        const node = houseNode(slug);
        if (!node) return;
        fieldsOf(slug).forEach((input) => {
          input.readOnly = !on;
        });
        const editBtn = node.querySelector('.edit-btn');
        const saveBtn = node.querySelector('.save-btn');
        const note = node.querySelector('.lock-note');
        const confirm = node.querySelector('.save-confirm');
        if (editBtn) editBtn.classList.toggle('hidden', on);
        if (saveBtn) {
          saveBtn.classList.toggle('hidden', !on);
          saveBtn.disabled = !on || !isCodesUser();
        }
        if (note) note.classList.toggle('hidden', !on);
        if (confirm) confirm.classList.add('hidden');
        const status = node.querySelector('.save-status');
        if (status) status.textContent = '';
      }

      function restoreHouseFields(slug) {
        const base = baselineBySlug.get(slug) || {};
        fieldsOf(slug).forEach((input) => {
          const key = input.dataset.field;
          input.value = base[key] == null ? '' : String(base[key]);
          updateDateOverdueState(input);
        });
      }

      let discardPromptOpen = false;

      function askDiscard(houseName) {
        if (discardPromptOpen) return Promise.resolve(false);
        discardPromptOpen = true;
        return new Promise((resolve) => {
          const prompt = buildDiscardPrompt(document, houseName);
          const finish = (discarded) => {
            discardPromptOpen = false;
            if (prompt.wrap.remove) prompt.wrap.remove();
            resolve(discarded);
          };
          prompt.keep.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            finish(false);
          });
          prompt.discard.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            finish(true);
          });
        });
      }

      async function openHouseEdit(slug) {
        if (!isCodesUser()) return;
        const leaving = Boolean(editingSlug && editingSlug !== slug);
        const dirty = Boolean(leaving && changeLabels(baselineBySlug.get(editingSlug) || {}, collectForm(editingSlug)).length);
        if (leaving && dirty) {
          const currentName = houseDisplayName((DEFAULTS.find((item) => item.slug === editingSlug) || {}).address);
          const discarded = await askDiscard(currentName);
          if (!discarded) return;
          restoreHouseFields(editingSlug);
          setHouseEditing(editingSlug, false);
        } else if (leaving) {
          setHouseEditing(editingSlug, false);
        } else if (editingSlug === slug) {
          return;
        }
        editingSlug = slug;
        setHouseEditing(slug, true);
      }

      function showSaveConfirm(slug, address) {
        if (!isCodesUser() || editingSlug !== slug) return;
        const node = houseNode(slug);
        if (!node) return;
        const labels = changeLabels(baselineBySlug.get(slug) || {}, collectForm(slug));
        const box = node.querySelector('.save-confirm');
        const line = node.querySelector('.save-confirm-line');
        if (!labels.length) {
          if (box) box.classList.add('hidden');
          return;
        }
        if (line) line.textContent = saveConfirmLine(houseDisplayName(address), labels);
        if (box) box.classList.remove('hidden');
      }

      let saveInFlight = null;

      async function commitHouseSave(slug, address) {
        if (!isCodesUser() || editingSlug !== slug || saveInFlight) return;
        const node = houseNode(slug);
        if (!node) return;
        const payload = collectForm(slug);
        const labels = changeLabels(baselineBySlug.get(slug) || {}, payload);
        const box = node.querySelector('.save-confirm');
        const line = node.querySelector('.save-confirm-line');
        if (!labels.length) {
          if (box) box.classList.add('hidden');
          return;
        }
        const expected = saveConfirmLine(houseDisplayName(address), labels);
        if (!line || line.textContent !== expected) {
          if (line) line.textContent = expected;
          if (box) box.classList.remove('hidden');
          return;
        }
        saveInFlight = slug;
        const saveBtn = node.querySelector('.save-btn');
        if (saveBtn) saveBtn.disabled = true;
        if (box) box.classList.add('hidden');
        try {
          await runTransaction(db, async (transaction) => {
            const snap = await transaction.get(liveRef(slug));
            const serverAt = snap.exists() ? snap.data().updatedAt : null;
            if (!sameUpdatedAt(loadedUpdatedAtBySlug.get(slug), serverAt)) {
              const conflict = new Error('codes-conflict');
              conflict.code = 'codes-conflict';
              throw conflict;
            }
            const merged = Object.assign({}, snap.exists() ? snap.data() : {}, payload);
            const digest = await hashCodeFields(merged);
            const previousHash = snap.exists() ? (snap.data().contentHash || '') : '';
            transaction.set(liveRef(slug), {
              ...payload,
              contentHash: digest,
              updatedAt: serverTimestamp()
            }, { merge: true });
            if (digest !== previousHash) {
              transaction.set(doc(versionsCol(slug)), {
                fields: canonicalizeCodeFields(merged),
                contentHash: digest,
                createdAt: serverTimestamp(),
                expireAt: Timestamp.fromMillis(Date.now() + 90 * 24 * 60 * 60 * 1000),
                source: 'page'
              });
            }
          });
          try {
            const after = await getDoc(liveRef(slug));
            rememberHouseLoad(slug, after.exists() ? after.data() : payload);
          } catch (readErr) {
            console.error('saved codes read-back failed', readErr && readErr.code);
            const prior = baselineBySlug.get(slug) || {};
            baselineBySlug.set(slug, { ...prior, ...payload });
          }
          editingSlug = null;
          setHouseEditing(slug, false);
          setSaveStatus(slug, formatSavedTime(new Date()));
        } catch (err) {
          console.error('Failed to save codes', err && err.code);
          if (err && (err.code === 'codes-conflict' || err.message === 'codes-conflict')) {
            setSaveStatus(slug, conflictMessage(houseDisplayName(address)));
          } else {
            setSaveStatus(slug, SAVE_FAILURE);
          }
        } finally {
          saveInFlight = null;
          if (saveBtn && editingSlug === slug) saveBtn.disabled = false;
        }
      }

      function bindHouse(node, slug, address) {
        const summaryRow = node.querySelector('.flex-between');
        if (summaryRow && !summaryRow.querySelector('.history-btn')) {
          const prev = document.createElement('button');
          prev.type = 'button';
          prev.className = 'history-btn';
          prev.dataset.history = slug;
          prev.textContent = 'Previous';
          const actions = summaryRow.querySelector('.save-actions');
          if (actions) summaryRow.insertBefore(prev, actions);
          else summaryRow.appendChild(prev);
          const panel = document.createElement('div');
          panel.className = 'history-panel hidden';
          panel.dataset.historyPanel = slug;
          const body = node.querySelector('.property-body');
          if (body) body.prepend(panel);
          prev.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
              try {
                await loadHistory(panel, slug, address, historyOpts(panel));
              } catch (err) {
                console.error(err);
                panel.textContent = 'Could not load history.';
              }
            }
          });
        }

        const editBtn = node.querySelector('.edit-btn');
        if (editBtn && editBtn.dataset.bound !== '1') {
          editBtn.dataset.bound = '1';
          editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openHouseEdit(slug);
          });
        }

        const saveBtn = node.querySelector('.save-btn');
        if (saveBtn && saveBtn.dataset.bound !== '1') {
          saveBtn.dataset.bound = '1';
          saveBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showSaveConfirm(slug, address);
          });
        }

        const confirmSave = node.querySelector('.confirm-save');
        if (confirmSave && confirmSave.dataset.bound !== '1') {
          confirmSave.dataset.bound = '1';
          confirmSave.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            commitHouseSave(slug, address);
          });
        }

        const confirmCancel = node.querySelector('.confirm-cancel');
        if (confirmCancel && confirmCancel.dataset.bound !== '1') {
          confirmCancel.dataset.bound = '1';
          confirmCancel.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const box = node.querySelector('.save-confirm');
            if (box) box.classList.add('hidden');
          });
        }
      }

      const snapshot = await getDocsFromServer(collection(db, 'property_codes'));
      if (generation !== loadGeneration) return;
      const docsBySlug = new Map();
      snapshot.forEach((d) => docsBySlug.set(d.id, d.data()));

      setApprovedChrome(true);
      editingSlug = null;
      renderAllHouses(docsBySlug);
      DEFAULTS.forEach((property) => {
        const node = list.querySelector(`details[data-house="${property.slug}"]`);
        if (node) bindHouse(node, property.slug, property.address);
      });

      const pageHistoryBtn = document.getElementById('page-history-btn');
      const pageHistoryPanel = document.getElementById('page-history-panel');
      startNotes();

      if (pageHistoryBtn && pageHistoryPanel && pageHistoryBtn.dataset.bound !== '1') {
        pageHistoryBtn.dataset.bound = '1';
        pageHistoryBtn.addEventListener('click', (e) => {
          e.preventDefault();
          pageHistoryPanel.classList.toggle('hidden');
          if (!pageHistoryPanel.classList.contains('hidden')) {
            renderHousePicker(pageHistoryPanel);
          }
        });
      }
    }

    // ── Notes ────────────────────────────────────────────────────────────────
    // Subscribe only after an allowlisted load. Signed-out reads of notes/codes are denied.
    let notesUnsub = null;
    const NOTES_DOC = doc(db, 'notes', 'codes');
    const notesTA = document.getElementById('notes-textarea');
    const notesSave = document.getElementById('notes-save-btn');
    const notesCopy = document.getElementById('notes-copy-btn');
    function stopNotes() {
      if (notesUnsub) {
        notesUnsub();
        notesUnsub = null;
      }
      if (notesTA) notesTA.value = '';
    }
    function startNotes() {
      if (notesUnsub || !notesTA) return;
      notesUnsub = onSnapshot(NOTES_DOC, (snap) => {
        if (snap.exists() && document.activeElement !== notesTA)
          notesTA.value = snap.data().text || '';
      }, () => {
        if (notesTA) notesTA.value = '';
      });
    }
    notesSave.addEventListener('click', async () => {
      notesSave.textContent = 'Saving…'; notesSave.disabled = true;
      try { await setDoc(NOTES_DOC, { text: notesTA.value }, { merge: true }); notesSave.textContent = 'Saved!'; }
      catch { notesSave.textContent = 'Error'; }
      setTimeout(() => { notesSave.textContent = 'Save'; notesSave.disabled = false; }, 1500);
    });
    notesCopy.addEventListener('click', () => {
      navigator.clipboard.writeText(notesTA.value).then(() => {
        notesCopy.classList.add('copied');
        setTimeout(() => notesCopy.classList.remove('copied'), 1500);
      });
    });

    showSignedOut();

    onAuthStateChanged(auth, (user) => {
      const generation = ++loadGeneration;
      if (!user) {
        showSignedOut();
        return;
      }
      if (!isApprovedCodesUser(user)) {
        showNotApproved();
        return;
      }
      showLoading();
      initCodes(generation).then(() => {
        if (generation !== loadGeneration) return;
        setCodesStatus('');
      }).catch((err) => {
        if (generation !== loadGeneration) return;
        console.error('codes load failed', err && err.code);
        if (isPermissionDenied(err)) showNotApproved();
        else showLoadError();
      });
    });
    document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));
  </script>
</body>
</html>
