<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadSplit Vendors</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #fbbf24;
      --error: #f87171;
      --text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(34,197,94,0.08), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }

    /* Vendors */
    .vendor-section { margin-top: 0; }
    .vendor-section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .vendor-section-header h2 { margin: 0; font-size: 1.2rem; }
    .add-vendor-btn {
      background: none;
      border: 1px solid rgba(56,189,248,0.4);
      border-radius: 6px;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      transition: background 0.15s;
    }
    .add-vendor-btn:hover { background: rgba(56,189,248,0.1); }
    .vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .vendor-card {
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .vendor-field-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.15rem;
    }
    .vendor-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.4rem 0.6rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .vendor-input:focus { border-color: var(--accent); }
    .vendor-card-footer { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; margin-top: 0.25rem; }
    .v-save-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .v-save-btn:hover { color: var(--success); border-color: var(--success); }
    .v-copy-btn {
      background: none;
      border: 1px solid rgba(148,163,184,0.25);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      display: flex;
      align-items: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .v-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .v-copy-btn.copied { color: var(--success); border-color: var(--success); }
    .v-copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .v-del-btn {
      background: none;
      border: none;
      color: rgba(248,113,113,0.5);
      cursor: pointer;
      font-size: 0.85rem;
      margin-right: auto;
      padding: 0.2rem 0.3rem;
      transition: color 0.15s;
    }
    .v-del-btn:hover { color: var(--error); }
    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
  <link rel="stylesheet" href="./operations.css">
  <link rel="stylesheet" href="./password-reset.css">
  <link rel="stylesheet" href="./editable-search.css">
  <script defer src="./navigation.js"></script>
</head>
<body>
  <div id="gate-overlay" style="position:fixed;inset:0;z-index:100;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:2rem">
    <div style="max-width:380px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0));border:1px solid rgba(148,163,184,0.2);border-radius:12px;padding:1.5rem;box-shadow:0 14px 40px rgba(15,23,42,0.4)">
      <h2 style="margin:0 0 0.35rem;font-size:1.2rem;color:#e2e8f0">Sign In</h2>
      <p style="margin:0 0 1rem;color:#94a3b8;font-size:0.9rem">PadSplit Dashboard</p>
      <form id="gate-form" style="display:flex;flex-direction:column;gap:0.5rem">
        <label for="gate-email" class="gate-label">Email</label>
        <input aria-label="Email" id="gate-email" type="email" placeholder="Email" autocomplete="email" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <label for="gate-password" class="gate-label">Password</label>
        <input aria-label="Password" id="gate-password" type="password" placeholder="Password" autocomplete="current-password" style="background:#0b1222;border:1px solid rgba(148,163,184,0.35);color:#e2e8f0;border-radius:8px;padding:0.45rem 0.6rem;font-size:0.95rem;outline:none;font-family:inherit"/>
        <button type="button" class="password-toggle" aria-controls="gate-password" aria-pressed="false">Show password</button>
        <button type="submit" style="border:none;border-radius:8px;background:#38bdf8;color:#0b1222;font-weight:700;padding:0.45rem 0.9rem;cursor:pointer;margin-top:0.25rem;font-family:inherit">Sign In</button>
      </form>
      <div role="alert" id="gate-error" style="color:#f87171;font-size:0.9rem;margin-top:0.6rem;display:none">Sign-in failed. Check your credentials and connection, then try again.</div>
    </div>
  </div>
  <header>
    <h1>Vendors</h1>
    <div class="header-meta">
      <button id="signout-btn" class="header-link" style="background:none;border:none;cursor:pointer;padding:0">Sign out</button>
    </div>
  </header>
  <nav class="ops-nav" aria-label="Main navigation">
    <a href="./index.html">Overview</a>
    <a href="./private-messages.html">Messages</a>
    <a href="./templates.html">Templates</a>
    <a href="./codes.html">Codes</a>
    <a href="./stats.html">Stats</a>
    <a href="./vendors.html" aria-current="page">Vendors</a>
    <a href="./kpi-history.html">History</a>
  </nav>


  <div class="vendor-section">
    <div class="vendor-section-header">
      <h2>Vendors</h2>
      <button class="add-vendor-btn" id="add-vendor-btn">+ Add Vendor</button>
    </div>
    <div class="list-search"><label for="vendor-search">Search vendors<input id="vendor-search" type="search" autocomplete="off" placeholder="Name, service, contact or location"></label><p id="vendor-search-status" role="status" aria-live="polite"></p></div>
    <div class="vendor-grid" id="vendor-grid">
      <p id="vendor-status" style="color:var(--muted);font-size:0.85rem">Loading vendors…</p>
    </div>
  </div>

  <dialog id="vendor-dialog" aria-labelledby="vendor-dialog-title">
    <form id="vendor-create-form">
      <h2 id="vendor-dialog-title">Add vendor</h2>
      <div class="vendor-form-fields">
        <label>Name <input name="name" required maxlength="200" autocomplete="organization"></label>
        <label>Specialty <input name="specialty" maxlength="200"></label>
        <label>Contact <input name="contact" maxlength="200"></label>
        <label>Location / area <input name="location" maxlength="200"></label>
      </div>
      <p id="vendor-create-status" role="status" aria-live="polite"></p>
      <div class="vendor-form-actions"><button type="button" id="vendor-cancel">Cancel</button><button type="submit">Create vendor</button></div>
    </form>
  </dialog>

  <footer id="vendor-storage-info">
    Vendor data stored in Firestore. Changes sync in real-time.
  </footer>

  <script src="./draft-guard.js"></script>
  <script src="./editable-search.js"></script>
  <script src="./auth-listeners.js"></script>
  <script src="./password-reset.js"></script>
  <script src="./runtime-config.js"></script>
  <script src="./api-client.js"></script>
  <script src="./vendors-api.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, setDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const apiRequired = document.querySelector('meta[name="padsplit-data-mode"]')?.content === 'api';
    let runtime;
    try { runtime = resolveVendorRuntime(window.PADSPLIT_RUNTIME_CONFIG, apiRequired); }
    catch {
      document.getElementById('gate-error').textContent = 'The private service is not configured. Contact your administrator.';
      document.getElementById('gate-error').style.display = 'block';
      document.getElementById('gate-form').querySelector('button[type="submit"]').disabled = true;
      throw new Error('API configuration unavailable.');
    }
    const apiMode = runtime.mode === 'api';
    const firebaseConfig = apiMode ? runtime.firebase : window.PADSPLIT_RUNTIME_CONFIG?.firebase ?? null;
    const app = initializeApp(firebaseConfig);
    const db = apiMode ? null : getFirestore(app);
    const auth = getAuth(app);
    let operationsApi = null;
    if (apiMode) {
      try { operationsApi = createOperationsApi({baseUrl:runtime.apiOrigin, getUser:() => auth.currentUser}); }
      catch {
        document.getElementById('gate-error').textContent = 'The private service is not available. Contact your administrator.';
        document.getElementById('gate-error').style.display = 'block';
        document.getElementById('gate-form').querySelector('button[type="submit"]').disabled = true;
        throw new Error('API client unavailable.');
      }
    }
    if (apiMode) document.getElementById('vendor-storage-info').textContent = 'Vendor data is private. Updates refresh periodically.';

    // ── Vendors ──────────────────────────────────────────────────────────────
    const COPY_ICON = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

    function buildVendorCard(docId, data = {}) {
      const card = document.createElement('div');
      card.className = 'vendor-card';
      card.dataset.docId = docId;
      if (apiMode) card.dataset.version = String(data.version);

      const fields = [
        { key: 'name',      label: 'Name',             placeholder: 'e.g. John Smith' },
        { key: 'specialty', label: 'Specialty',         placeholder: 'e.g. Plumbing' },
        { key: 'contact',   label: 'Contact',           placeholder: 'Phone or email' },
        { key: 'location',  label: 'Location / Area',   placeholder: 'e.g. Dallas, TX' },
      ];

      const inputs = {};
      fields.forEach(({ key, label, placeholder }) => {
        const lbl = document.createElement('div');
        lbl.className = 'vendor-field-label';
        lbl.textContent = label;
        const inp = document.createElement('input');
        inp.className = 'vendor-input';
        inp.placeholder = placeholder;
        inp.setAttribute('aria-label', label);
        inp.addEventListener('input', () => markDraft(inp));
        inp.value = data[key] || '';
        inputs[key] = inp;
        card.appendChild(lbl);
        card.appendChild(inp);
      });

      const footer = document.createElement('div');
      footer.className = 'vendor-card-footer';

      const delBtn = document.createElement('button');
      delBtn.className = 'v-del-btn';
      delBtn.title = 'Delete vendor';
      delBtn.setAttribute('aria-label', 'Delete vendor');
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', async () => {
        if (delBtn.disabled || !confirm('Delete this vendor?')) return;
        delBtn.disabled = true;
        const submittingUid = auth.currentUser?.uid;
        try {
          if (apiMode) {
            await operationsApi.deleteVendor(docId, Number(card.dataset.version));
            if (auth.currentUser?.uid === submittingUid && vendorCards.get(docId) === card) {
              invalidateApiPolls();
              card.remove(); vendorCards.delete(docId); filterVendors();
            }
          } else await deleteDoc(doc(db, 'vendors', docId));
        }
        catch (error) {
          if (auth.currentUser?.uid === submittingUid && vendorCards.get(docId) === card) {
            if (apiMode && (error.status === 401 || error.status === 403)) { revokeVendorAccess(); return; }
            if (apiMode && error.status === 409) reloadBtn.hidden = false;
            upsertVendorStatus(error.status === 409 ? 'This vendor changed. Your edits are preserved; refresh this record before deleting.' : 'Could not delete vendor. Check your access and try again.', 'var(--error)');
          }
        }
        finally { delBtn.disabled = false; }
      });

      const saveBtn = document.createElement('button');
      saveBtn.className = 'v-save-btn';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', async () => {
        if (saveBtn.disabled) return;
        const submitted = Object.fromEntries(Object.entries(inputs).map(([key, input]) => [key, input.value]));
        const normalized = normalizeVendor(submitted);
        if (!normalized) { upsertVendorStatus('Enter a vendor name and keep each field within 200 characters.', 'var(--error)'); inputs.name.focus(); return; }
        const changedKeys = new Set(Object.entries(inputs).filter(([, input]) => input.dataset.dirty === 'true').map(([key]) => key));
        const apiChanges = apiMode ? vendorChangedFields(normalized, changedKeys) : null;
        if (apiMode && !changedKeys.size) { upsertVendorStatus('No vendor changes to save.'); return; }
        saveBtn.textContent = 'Saving…';
        saveBtn.disabled = true;
        const submittingUid = auth.currentUser?.uid;
        try {
          if (apiMode) {
            const result = await operationsApi.updateVendor(docId, {...apiChanges, expected_version:Number(card.dataset.version)});
            if (!Number.isSafeInteger(result.version) || result.version < 1) throw new Error('Invalid update response.');
            if (auth.currentUser?.uid !== submittingUid || vendorCards.get(docId) !== card) return;
            invalidateApiPolls();
            card.dataset.version = String(result.version);
            card.dataset.conflict = 'false';
            reloadBtn.hidden = true;
          } else await setDoc(doc(db, 'vendors', docId), normalized, { merge: true });
          Object.entries(inputs).forEach(([key, input]) => { if (!apiMode || changedKeys.has(key)) markDraftSaved(input, submitted[key]); });
          saveBtn.textContent = 'Saved!';
        } catch (error) {
          saveBtn.textContent = 'Error';
          if (apiMode && (error.status === 401 || error.status === 403) && auth.currentUser?.uid === submittingUid) { revokeVendorAccess(); return; }
          if (apiMode && error.status === 409 && auth.currentUser?.uid === submittingUid && vendorCards.get(docId) === card) {
            card.dataset.conflict = 'true'; reloadBtn.hidden = false;
            upsertVendorStatus('This vendor changed elsewhere. Your draft is preserved; review it, then refresh this record.', 'var(--error)');
          }
        }
        setTimeout(() => { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1500);
      });

      const reloadBtn = document.createElement('button');
      reloadBtn.type = 'button'; reloadBtn.className = 'v-reload-btn'; reloadBtn.textContent = 'Refresh record'; reloadBtn.hidden = true;
      reloadBtn.addEventListener('click', async () => {
        if (!apiMode || !confirm('Refresh this vendor and discard its unsaved edits?')) return;
        const before = Object.fromEntries(Object.entries(inputs).map(([key, input]) => [key, input.value]));
        const requestingUid = auth.currentUser?.uid;
        reloadBtn.disabled = true;
        try {
          const rows = await loadAllApiVendors(operationsApi);
          if (auth.currentUser?.uid !== requestingUid || vendorCards.get(docId) !== card) return;
          if (Object.entries(inputs).some(([key, input]) => input.value !== before[key])) {
            upsertVendorStatus('Your draft changed while refreshing and was preserved.', 'var(--error)'); return;
          }
          const row = rows.find(item => item.id === docId);
          if (!row) { card.remove(); vendorCards.delete(docId); filterVendors(); return; }
          invalidateApiPolls();
          Object.entries(inputs).forEach(([key,input]) => { input.value = row[key] || ''; delete input.dataset.dirty; });
          card.dataset.version = String(row.version); card.dataset.conflict = 'false'; reloadBtn.hidden = true;
          upsertVendorStatus('Vendor refreshed.'); filterVendors();
        } catch (error) {
          if (error.status === 401 || error.status === 403) revokeVendorAccess();
          else upsertVendorStatus('Could not refresh vendor. Your draft is preserved.', 'var(--error)');
        }
        finally { reloadBtn.disabled = false; }
      });

      const copyBtn = document.createElement('button');
      copyBtn.className = 'v-copy-btn';
      copyBtn.title = 'Copy to clipboard';
      copyBtn.setAttribute('aria-label', 'Copy vendor details');
      copyBtn.innerHTML = COPY_ICON;
      copyBtn.addEventListener('click', () => {
        const text = [
          inputs.name.value,
          inputs.specialty.value,
          inputs.contact.value,
          inputs.location.value,
        ].filter(Boolean).join(' | ');
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.classList.add('copied');
          setTimeout(() => copyBtn.classList.remove('copied'), 1500);
        });
      });

      footer.appendChild(delBtn);
      footer.appendChild(saveBtn);
      if (apiMode) footer.appendChild(reloadBtn);
      footer.appendChild(copyBtn);
      card.appendChild(footer);
      return card;
    }

    const vendorGrid = document.getElementById('vendor-grid');
    const vendorCards = new Map(); // docId → card element
    const vendorSearch = document.getElementById('vendor-search');
    function filterVendors() {
      const count = filterEditableCards(vendorCards.values(), vendorSearch.value);
      document.getElementById('vendor-search-status').textContent = vendorSearch.value.trim() ? `${count} matching vendors` : '';
    }
    vendorSearch.addEventListener('input', filterVendors);
    function upsertVendorStatus(message, colorVar = 'var(--muted)') {
      let status = document.getElementById('vendor-status');
      if (!status) {
        status = document.createElement('p');
        status.id = 'vendor-status';
        status.style.fontSize = '0.85rem';
        vendorGrid.appendChild(status);
      }
      status.textContent = message;
      status.style.color = colorVar;
    }

    let vendorRequestSequence = 0, vendorLastApplied = 0, createIntent = null, stopVendorApi = () => {};
    function invalidateApiPolls() { vendorLastApplied = ++vendorRequestSequence; }
    function revokeVendorAccess() {
      stopVendorApi(); operationsApi.clearSession(); invalidateApiPolls(); createIntent = null;
      vendorCards.forEach(card => card.remove()); vendorCards.clear();
      document.getElementById('add-vendor-btn').disabled = true;
      const dialog = document.getElementById('vendor-dialog');
      if (dialog.open) dialog.close();
      document.getElementById('vendor-create-form').reset();
      upsertVendorStatus('Account access expired or was revoked. Sign in again.', 'var(--error)');
    }
    function applyApiVendors({sequence, rows}) {
      if (sequence < vendorLastApplied) return;
      vendorLastApplied = sequence;
      let conflict = false;
      const ids = new Set(rows.map(row => row.id));
      for (const row of rows) {
        let card = vendorCards.get(row.id);
        if (!card) {
          card = buildVendorCard(row.id, row);
          vendorCards.set(row.id, card); vendorGrid.appendChild(card);
          continue;
        }
        const inputs = [...card.querySelectorAll('.vendor-input')];
        if (row.version < Number(card.dataset.version)) continue;
        const hasDraft = inputs.some(input => !canApplyRemote(input, document.activeElement));
        const decision = vendorRemoteDecision(Number(card.dataset.version), row.version, hasDraft);
        if (decision.conflict) {
          card.dataset.conflict = 'true'; card.querySelector('.v-reload-btn').hidden = false; conflict = true;
        }
        if (decision.replace) {
          ['name','specialty','contact','location'].forEach((key,index) => { inputs[index].value = row[key] || ''; });
          card.dataset.version = String(row.version); card.dataset.conflict = 'false';
          card.querySelector('.v-reload-btn').hidden = true;
        }
      }
      for (const [id,card] of vendorCards) if (!ids.has(id)) {
        const hasDraft = [...card.querySelectorAll('.vendor-input')].some(input => !canApplyRemote(input, document.activeElement));
        if (hasDraft) { card.dataset.conflict = 'true'; card.querySelector('.v-reload-btn').hidden = false; conflict = true; }
        else { card.remove(); vendorCards.delete(id); }
      }
      if (conflict) upsertVendorStatus('A vendor changed elsewhere. Your draft is preserved; review it, then refresh the record.', 'var(--error)');
      else if (!rows.length) upsertVendorStatus('No vendors yet. Click + Add Vendor to create one.');
      else document.getElementById('vendor-status')?.remove();
      filterVendors();
    }
    async function refreshApiVendors(signal) {
      const sequence = ++vendorRequestSequence;
      return {sequence, rows:await loadAllApiVendors(operationsApi, signal)};
    }

    function initFirestore() {
    if (apiMode) {
      authListeners.add(() => {
        let stopped = false, stopPoll = () => {};
        const expectedUser = auth.currentUser;
        document.getElementById('add-vendor-btn').disabled = true;
        upsertVendorStatus('Checking account access…');
        operationsApi.me().then(identity => {
          if (stopped || auth.currentUser !== expectedUser) return;
          if (identity?.role !== 'owner' || identity.uid !== expectedUser?.uid) {
            upsertVendorStatus('This page requires an owner account.', 'var(--error)'); return;
          }
          document.getElementById('add-vendor-btn').disabled = false;
          stopPoll = operationsApi.poll(refreshApiVendors, applyApiVendors, error => {
            if (error.status === 401 || error.status === 403) revokeVendorAccess();
            else upsertVendorStatus('Vendors could not be loaded. Existing drafts are preserved.', 'var(--error)');
          });
          stopVendorApi = stopPoll;
        }).catch(() => {
          if (!stopped && auth.currentUser === expectedUser) upsertVendorStatus('Account access could not be verified. Try signing in again.', 'var(--error)');
        });
        return () => { stopped = true; stopPoll(); stopVendorApi = () => {}; document.getElementById('add-vendor-btn').disabled = true; };
      });
    } else {
    authListeners.add(() => onSnapshot(
      query(collection(db, 'vendors'), orderBy('name')),
      (snapshot) => {
        if (!snapshot.empty || vendorCards.size > 0) {
          document.getElementById('vendor-status')?.remove();
        }
        snapshot.docChanges().forEach(change => {
          const docId = change.doc.id;
          if (change.type === 'removed') {
            vendorCards.get(docId)?.remove();
            vendorCards.delete(docId);
            return;
          }
          const data = change.doc.data();
          if (change.type === 'added' && !vendorCards.has(docId)) {
            const card = buildVendorCard(docId, data);
            vendorCards.set(docId, card);
            vendorGrid.appendChild(card);
          } else if (change.type === 'modified' || change.type === 'added') {
            const card = vendorCards.get(docId);
            if (!card) return;
            const keys = ['name', 'specialty', 'contact', 'location'];
            card.querySelectorAll('.vendor-input').forEach((inp, i) => {
              if (canApplyRemote(inp, document.activeElement)) inp.value = data[keys[i]] || '';
            });
          }
        });
        const remoteIds = snapshot.docs.map(item => item.id);
        for (const id of staleListenerIds(vendorCards.keys(), remoteIds)) {
          vendorCards.get(id)?.remove();
          vendorCards.delete(id);
        }
        if (snapshot.empty && vendorCards.size === 0) {
          upsertVendorStatus('No vendors yet. Click + Add Vendor to create one.');
        }
        filterVendors();
      },
      (err) => {
        console.error('Vendors listener failed:', err);
        upsertVendorStatus(`Vendors failed to load: ${err.message}`, 'var(--error)');
      }
    ));
    }

    const addVendorBtn = document.getElementById('add-vendor-btn');
    const vendorDialog = document.getElementById('vendor-dialog');
    const vendorForm = document.getElementById('vendor-create-form');
    const createStatus = document.getElementById('vendor-create-status');
    addVendorBtn.addEventListener('click', () => {
      if (addVendorBtn.disabled) return;
      vendorForm.reset(); createStatus.textContent = ''; vendorDialog.showModal();
      vendorForm.elements.namedItem('name').focus();
    });
    document.getElementById('vendor-cancel').addEventListener('click', () => vendorDialog.close());
    vendorForm.addEventListener('submit', async event => {
      event.preventDefault();
      const submit = vendorForm.querySelector('button[type="submit"]');
      if (submit.disabled) return;
      const values = normalizeVendor(Object.fromEntries(new FormData(vendorForm)));
      if (!values) { createStatus.textContent = 'Enter a vendor name and keep each field within 200 characters.'; return; }
      const submittingUid = auth.currentUser?.uid;
      submit.disabled = true; createStatus.textContent = 'Creating vendor…';
      try {
        if (apiMode) {
          const signature = JSON.stringify(values);
          if (!createIntent || createIntent.signature !== signature) {
            if (!globalThis.crypto?.randomUUID) throw new Error('Secure request identifiers unavailable.');
            createIntent = {signature, key:crypto.randomUUID()};
          }
          await operationsApi.createVendor(values, createIntent.key);
          invalidateApiPolls(); createIntent = null;
        } else await addDoc(collection(db, 'vendors'), values);
        if (auth.currentUser?.uid === submittingUid) {
          if (vendorDialog.open) vendorDialog.close();
          upsertVendorStatus('Vendor created.');
          if (apiMode) refreshApiVendors().then(applyApiVendors).catch(() => {
            if (auth.currentUser?.uid === submittingUid) upsertVendorStatus('Vendor created; the list could not be refreshed.', 'var(--error)');
          });
        }
      } catch (error) {
        if (auth.currentUser?.uid === submittingUid) {
          if (apiMode && (error.status === 401 || error.status === 403)) revokeVendorAccess();
          else createStatus.textContent = 'Could not add vendor. Check your access and try again.';
        }
      } finally {
        submit.disabled = false;
      }
    });
    } // end initFirestore

    const gateOverlay = document.getElementById('gate-overlay');
    const gateForm = document.getElementById('gate-form');
    mountPasswordReset({auth, sender: sendPasswordResetEmail, form: gateForm, signInEmail: document.getElementById('gate-email')});
    const gateError = document.getElementById('gate-error');

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submit = gateForm.querySelector('button[type="submit"]');
      if (submit.disabled) return;
      submit.disabled = true;
      const label = submit.textContent;
      submit.textContent = 'Signing in…';
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('gate-email').value.trim(), document.getElementById('gate-password').value);
        gateError.style.display = 'none';
      } catch (err) {
        console.error(err);
        gateError.style.display = 'block';
      } finally {
        submit.disabled = false;
        submit.textContent = label;
      }
    });

    const authListeners = createAuthListeners({onIdentityChange: () => {
      if (apiMode) { operationsApi.clearSession(); invalidateApiPolls(); createIntent = null; document.getElementById('add-vendor-btn').disabled = true; }
      vendorCards.forEach(card => card.remove());
      vendorCards.clear();
      const dialog = document.getElementById('vendor-dialog');
      if (dialog.open) dialog.close();
      document.getElementById('vendor-create-form').reset();
      document.getElementById('vendor-create-status').textContent = '';
      vendorSearch.value = '';
      document.getElementById('vendor-search-status').textContent = '';
      document.getElementById('vendor-status')?.remove();
      upsertVendorStatus('Loading vendors…');
    }});
    let firestoreInited = false;
    onAuthStateChanged(auth, (user) => {
      if (user) {
        gateOverlay.style.display = 'none';
        if (!firestoreInited) { firestoreInited = true; initFirestore(); }
      } else {
        gateOverlay.style.display = 'flex';
      }
      authListeners.setUser(user);
    });

    document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));
  </script>

  <script>
    (() => {
      const toggle = document.querySelector('.password-toggle');
      const input = document.getElementById('gate-password');
      toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.textContent = show ? 'Hide password' : 'Show password';
      });
    })();
  </script>
</body>
</html>
