<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadSplit Codes</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --error: #f87171;
      --text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 35%),
                  radial-gradient(circle at 80% 0%, rgba(34,197,94,0.08), transparent 30%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem clamp(1rem, 4vw, 2.5rem);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
    .header-meta {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    .header-link {
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.95rem;
    }
    .header-link:hover { color: var(--accent); }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 14px 40px rgba(15,23,42,0.4);
    }
    .muted { color: var(--muted); }
    .error { color: var(--error); font-size: 0.9rem; }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }
    details {
      margin-top: 0.85rem;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,0.015);
    }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(148,163,184,0.14);
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    .property-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .save-btn {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      min-width: 86px;
    }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-btn.saved {
      background: var(--success);
      color: #05220f;
    }
    .history-btn {
      border: 1px solid rgba(148,163,184,0.4);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
    }
    .history-btn:hover { color: var(--accent); border-color: var(--accent); }
    .codes-intro {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .codes-intro .muted { margin: 0; }
    #page-history-panel { margin-top: 0.85rem; }
    .history-older { margin-top: 0.35rem; }
    .history-panel {
      margin-bottom: 0.85rem;
      padding: 0.75rem;
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 8px;
    }
    .history-row, .history-restore, .history-cancel {
      border: none;
      background: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0.25rem 0;
      display: block;
      text-align: left;
    }
    .history-preview { margin-top: 0.5rem; color: var(--muted); font-size: 0.88rem; white-space: pre-wrap; }
    .history-actions { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
    .property-body {
      padding: 0.85rem 1rem 1rem;
    }
    .section-label {
      margin: 0.9rem 0 0.4rem;
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      table-layout: fixed;
    }
    td {
      padding: 0.35rem 0.45rem;
      border-bottom: 1px solid rgba(148,163,184,0.08);
      vertical-align: middle;
    }
    td:first-child {
      width: 34%;
      color: var(--muted);
      font-weight: 500;
    }
    .table-wrap { overflow-x: auto; }
    table.multi-col {
      table-layout: auto;
      min-width: 720px;
    }
    table.multi-col th {
      text-align: left;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.4rem 0.45rem 0.5rem;
      border-bottom: 1px solid rgba(148,163,184,0.2);
      white-space: nowrap;
    }
    table.multi-col td:first-child {
      width: auto;
      min-width: 3.2rem;
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
    }
    table.multi-col .code-input { min-width: 5.5rem; }
    .section-hint {
      margin: 0 0 0.45rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .code-input {
      width: 100%;
      background: #0b1222;
      border: 1px solid rgba(148,163,184,0.35);
      color: var(--text);
      border-radius: 6px;
      padding: 0.25rem 0.4rem;
    }
    textarea.code-input {
      min-height: 4.5rem;
      resize: vertical;
      line-height: 1.4;
      font-family: inherit;
    }
    .code-input.overdue {
      border-color: #e53e3e;
      background: #fff5f5;
      color: #7f1d1d;
    }
    #gate-wrap {
      max-width: 430px;
      margin: 12vh auto 0;
    }
    #app-wrap { max-width: 1200px; margin: 0 auto; }
    .gate-title { margin-top: 0; margin-bottom: 0.35rem; }
    .gate-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .gate-form input {
      flex: 1;
      min-width: 180px;
      background: #0b1222;
      border: 1px solid rgba(148,163,184,0.35);
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
    }
    .gate-form button {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b1222;
      font-weight: 700;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }
    .hidden { display: none; }
    .shake {
      animation: shake 240ms linear 2;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }
    .notes-section { margin-top: 2rem; }
    .notes-section h2 { margin: 0 0 0.75rem; font-size: 1.2rem; }
    .notes-card { background: linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)); border: 1px solid rgba(148,163,184,.15); border-radius: 12px; padding: 1rem; }
    .notes-textarea { width: 100%; min-height: 120px; background: rgba(255,255,255,.04); border: 1px solid rgba(148,163,184,.2); border-radius: 8px; color: var(--text); font-family: inherit; font-size: .9rem; line-height: 1.5; padding: .65rem .75rem; resize: vertical; outline: none; transition: border-color .15s; box-sizing: border-box; }
    .notes-textarea:focus { border-color: var(--accent); }
    .notes-footer { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; margin-top: .5rem; }
    .notes-save-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: .8rem; padding: .3rem .65rem; transition: color .15s, border-color .15s; }
    .notes-save-btn:hover { color: var(--success); border-color: var(--success); }
    .notes-copy-btn { background: none; border: 1px solid rgba(148,163,184,.25); border-radius: 6px; color: var(--muted); cursor: pointer; padding: .3rem .5rem; display: flex; align-items: center; transition: color .15s, border-color .15s; }
    .notes-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .notes-copy-btn.copied { color: var(--success); border-color: var(--success); }
    .notes-copy-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

</head>
<body>
  <div id="gate-wrap" class="card hidden">
    <h2 class="gate-title">Codes Access</h2>
    <div class="muted">Enter password to view and edit property codes.</div>
    <form id="gate-form" class="gate-form">
      <label for="gate-email" class="gate-label">Email</label>
        <input aria-label="Email" id="gate-email" type="email" placeholder="Email" autocomplete="email" />
      <label for="gate-input" class="gate-label">Password</label>
        <input aria-label="Password" id="gate-input" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="button" class="password-toggle" aria-controls="gate-input" aria-pressed="false">Show password</button>
      <button type="submit">Unlock</button>
    </form>
    <div role="alert" id="gate-error" class="error hidden" style="margin-top:0.6rem">Sign-in failed. Check your credentials and connection, then try again.</div>
  </div>

  <div id="app-wrap" class="hidden">
    <header>
      <h1>Property Codes</h1>
      <div class="header-meta">
        <button id="signout-btn" class="header-link" style="background:none;border:none;cursor:pointer;padding:0">Sign out</button>
      </div>
    </header>
  <nav class="ops-nav" aria-label="Main navigation">
    <a href="./index.html">Overview</a>
    <a href="./private-messages.html">Messages</a>
    <a href="./templates.html">Templates</a>
    <a href="./codes.html" aria-current="page">Codes</a>
    <a href="./stats.html">Stats</a>
    <a href="./vendors.html">Vendors</a>
    <a href="./kpi-history.html">History</a>
  </nav>


    <div class="card">
      <div class="codes-intro">
        <button type="button" id="page-history-btn" class="history-btn" disabled>History</button>
        <button type="button" id="toggle-sensitive" class="history-btn" aria-pressed="false">Reveal sensitive values</button>
        <div class="muted">Values in parentheses indicate known conflicting entries and can be edited.</div>
      </div>
      <div id="page-history-panel" class="history-panel hidden"></div>
      <div id="codes-list"></div>
    </div>

    <section class="notes-section">
      <h2>Notes</h2>
      <div class="notes-card">
        <textarea aria-label="Shared notes" class="notes-textarea" id="notes-textarea" placeholder="Add shared notes…"></textarea>
        <div class="notes-footer">
          <button class="notes-save-btn" id="notes-save-btn">Save</button>
          <button class="notes-copy-btn" id="notes-copy-btn" aria-label="Copy notes" title="Copy notes"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
      </div>
    </section>
  </div>

  <script src="./draft-guard.js"></script>
  <script src="./password-reset.js"></script>
  <script src="./codes-schema.js"></script>
  <script src="./runtime-config.js"></script>
  <script src="./api-client.js"></script>
  <script src="./vendors-api.js"></script>
  <script src="./api-note.js"></script>
  <script src="./codes-api.js"></script>
  <script src="./codes-api-workspace.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const apiRequired = document.querySelector('meta[name="padsplit-data-mode"]')?.content === 'api';
    let runtime;
    try { runtime = resolveOperationsRuntime(window.PADSPLIT_RUNTIME_CONFIG, apiRequired); }
    catch {
      const error=document.getElementById('gate-error');error.textContent='The private service is not configured. Contact your administrator.';error.classList.remove('hidden');
      document.getElementById('gate-form').querySelector('button[type="submit"]').disabled=true;
      throw new Error('API configuration unavailable.');
    }
    if (runtime.mode !== 'api') throw new Error('API configuration unavailable.');
    const apiMode = true;
    const app = initializeApp(runtime.firebase);
    const auth = getAuth(app);
    let operationsApi = null;
    if(apiMode) {
      try {operationsApi=createOperationsApi({baseUrl:runtime.apiOrigin,getUser:()=>auth.currentUser});}
      catch {
        const error=document.getElementById('gate-error');error.textContent='The private service is not available. Contact your administrator.';error.classList.remove('hidden');
        document.getElementById('gate-form').querySelector('button[type="submit"]').disabled=true;
        throw new Error('API client unavailable.');
      }
    }

    const gateWrap = document.getElementById('gate-wrap');
    const appWrap = document.getElementById('app-wrap');
    const gateForm = document.getElementById('gate-form');
    mountPasswordReset({auth, sender: sendPasswordResetEmail, form: gateForm, signInEmail: document.getElementById('gate-email')});
    const gateInput = document.getElementById('gate-input');
    const gateError = document.getElementById('gate-error');
    const list = document.getElementById('codes-list');
    let codesUid;
    let codesGeneration = 0;
    let apiWorkspace = null, apiNotes = null;
    const apiDraftsByUid = new Map();
    list.addEventListener('input', event => {
      if (event.target.matches('input[data-prop][data-field], textarea[data-prop][data-field]')) event.target.dataset.dirty = 'true';
    });
    document.getElementById('toggle-sensitive').hidden = true;

    function showApp() {
      gateWrap.classList.add('hidden');
      appWrap.classList.remove('hidden');
      const generation=codesGeneration;
      initApiCodes().catch(() => {
        if (generation!==codesGeneration) return;
        list.textContent = 'Private code layouts could not be loaded. Check migration and account access.';
      });
    }

    function showGate() {
      gateWrap.classList.remove('hidden');
      appWrap.classList.add('hidden');
      gateInput.focus();
    }

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('gate-email').value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, gateInput.value);
        gateError.classList.add('hidden');
      } catch (err) {
        gateError.classList.remove('hidden');
        gateWrap.classList.remove('shake');
        void gateWrap.offsetWidth;
        gateWrap.classList.add('shake');
        gateInput.select();
      }
    });

    const OVERDUE_DAYS = {
      ac_filter_date: 90,
      dryer_lint_date: 30,
      garage_ac_filter_date: 90
    };
    const EXTRA_LOCKBOX_COUNT = 2;
    const ROOM_TABLE_HEADERS = ['Room', 'Room code', 'Lockbox code', 'Lockbox location', 'Lockbox notes', 'AC filter size'];
    const EXTRA_LOCKBOX_HEADERS = ['Name / number', 'Lockbox code', 'Location', 'Notes'];
    const HOUSE_NOTES_SECTION = {
      label: 'House notes',
      fields: [
        { key: 'garage_ac', label: 'Garage AC', value: '', placeholder: 'Present / model / location' },
        { key: 'garage_ac_filter_date', label: 'Garage AC filter change date', value: '', type: 'date' },
        { key: 'garage_ac_filter_size', label: 'Garage AC filter size', value: '', placeholder: '16x25x1' },
        { key: 'other_special', label: 'Other special things', value: '', type: 'textarea', placeholder: 'Freeform notes: garage extras, quirks, vendor info…' }
      ]
    };

    function roomNumberFromKey(key) {
      const match = /^r(\d+)$/.exec(key);
      return match ? Number(match[1]) : null;
    }

    function lockboxCodeKey(n) { return `lockbox_${n}`; }
    function lockboxLocationKey(n) { return `lockbox_${n}_location`; }
    function lockboxNotesKey(n) { return `lockbox_${n}_notes`; }
    function roomAcFilterSizeKey(n) { return `r${n}_ac_filter_size`; }
    function extraLockboxKeys(n) {
      return {
        name: `extra_lockbox_${n}_name`,
        code: `extra_lockbox_${n}_code`,
        location: `extra_lockbox_${n}_location`,
        notes: `extra_lockbox_${n}_notes`
      };
    }

    function defaultFieldValue(property, key, fallback = '') {
      for (const section of property.sections) {
        const field = (section.fields || []).find((item) => item.key === key);
        if (field) return field.value;
      }
      return fallback;
    }

    let currentHasLiveDoc = false;

    function resolveSavedOrDefault(savedValues, key, fallback = '') {
      if (currentHasLiveDoc) {
        return Object.prototype.hasOwnProperty.call(savedValues, key)
          ? savedValues[key]
          : '';
      }
      return Object.prototype.hasOwnProperty.call(savedValues, key)
        ? savedValues[key]
        : fallback;
    }

    function updateDateOverdueState(input) {
      const days = OVERDUE_DAYS[input.dataset.field];
      input.classList.remove('overdue');
      if (!days || !input.value) return;
      const parsed = new Date(input.value);
      if (Number.isNaN(parsed.getTime())) return;
      const ageMs = Date.now() - parsed.getTime();
      if (ageMs > days * 24 * 60 * 60 * 1000) input.classList.add('overdue');
    }

    function createFieldInput(property, fieldKey, value, options = {}) {
      const isTextarea = options.type === 'textarea';
      const input = document.createElement(isTextarea ? 'textarea' : 'input');
      if (!isTextarea) input.type = options.type || 'text';
      const sensitive = /^(?:r\d+|(?:front|back|outside|room)_(?:door|master)|front_back|admin|thermo|wifi.*|spectrum_code|tmobile_line|tenant_login|keys_\d+|lockbox_\d+|.*_code)$/i.test(fieldKey);
      if (sensitive && !isTextarea && (!options.type || options.type === 'text')) { input.type = 'password'; input.dataset.sensitive = 'true'; }
      input.className = isTextarea ? 'code-input code-textarea' : 'code-input';
      input.dataset.prop = property.slug;
      input.dataset.field = fieldKey;
      input.ariaLabel = `${property.address}: ${fieldKey.replace(/_/g, ' ')}`;
      input.value = value;
      if (options.placeholder) input.placeholder = options.placeholder;
      if (isTextarea) input.rows = options.rows || 3;
      updateDateOverdueState(input);
      input.addEventListener('input', () => updateDateOverdueState(input));
      return input;
    }

    function appendSectionLabel(body, text, hint) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = text;
      body.appendChild(label);
      if (hint) {
        const hintEl = document.createElement('div');
        hintEl.className = 'section-hint';
        hintEl.textContent = hint;
        body.appendChild(hintEl);
      }
    }

    function renderLabelValueTable(property, section, savedValues) {
      const table = document.createElement('table');
      const tbody = document.createElement('tbody');
      section.fields.forEach((field) => {
        const tr = document.createElement('tr');
        const tdLabel = document.createElement('td');
        tdLabel.textContent = field.label;
        const tdInput = document.createElement('td');
        const value = resolveSavedOrDefault(savedValues, field.key, field.value);
        tdInput.appendChild(createFieldInput(property, field.key, value, {
          type: field.type,
          placeholder: field.placeholder
        }));
        tr.appendChild(tdLabel);
        tr.appendChild(tdInput);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    function renderHeaderRow(headers) {
      const thead = document.createElement('thead');
      const tr = document.createElement('tr');
      headers.forEach((title) => {
        const th = document.createElement('th');
        th.textContent = title;
        tr.appendChild(th);
      });
      thead.appendChild(tr);
      return thead;
    }

    function wrapTable(table) {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      wrap.appendChild(table);
      return wrap;
    }

    function renderRoomsTable(property, roomSection, savedValues) {
      const table = document.createElement('table');
      table.className = 'multi-col';
      table.appendChild(renderHeaderRow(ROOM_TABLE_HEADERS));
      const tbody = document.createElement('tbody');

      roomSection.fields.forEach((field) => {
        const n = roomNumberFromKey(field.key);
        if (!n) return;
        const tr = document.createElement('tr');

        const tdRoom = document.createElement('td');
        tdRoom.textContent = field.label;
        tr.appendChild(tdRoom);

        const roomCode = document.createElement('td');
        roomCode.appendChild(createFieldInput(
          property,
          field.key,
          resolveSavedOrDefault(savedValues, field.key, field.value)
        ));
        tr.appendChild(roomCode);

        const lockboxCode = document.createElement('td');
        const lockboxKey = lockboxCodeKey(n);
        lockboxCode.appendChild(createFieldInput(
          property,
          lockboxKey,
          resolveSavedOrDefault(savedValues, lockboxKey, defaultFieldValue(property, lockboxKey, ''))
        ));
        tr.appendChild(lockboxCode);

        const lockboxLocation = document.createElement('td');
        const locationKey = lockboxLocationKey(n);
        lockboxLocation.appendChild(createFieldInput(
          property,
          locationKey,
          resolveSavedOrDefault(savedValues, locationKey, ''),
          { placeholder: 'Door / mount' }
        ));
        tr.appendChild(lockboxLocation);

        const lockboxNotes = document.createElement('td');
        const notesKey = lockboxNotesKey(n);
        lockboxNotes.appendChild(createFieldInput(
          property,
          notesKey,
          resolveSavedOrDefault(savedValues, notesKey, ''),
          { placeholder: 'Keys inside, etc.' }
        ));
        tr.appendChild(lockboxNotes);

        const filterSize = document.createElement('td');
        const sizeKey = roomAcFilterSizeKey(n);
        filterSize.appendChild(createFieldInput(
          property,
          sizeKey,
          resolveSavedOrDefault(savedValues, sizeKey, ''),
          { placeholder: '16x25x1' }
        ));
        tr.appendChild(filterSize);

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      return wrapTable(table);
    }

    function renderExtraLockboxesTable(property, savedValues) {
      const table = document.createElement('table');
      table.className = 'multi-col';
      table.appendChild(renderHeaderRow(EXTRA_LOCKBOX_HEADERS));
      const tbody = document.createElement('tbody');

      for (let n = 1; n <= EXTRA_LOCKBOX_COUNT; n += 1) {
        const keys = extraLockboxKeys(n);
        const tr = document.createElement('tr');

        const tdName = document.createElement('td');
        tdName.appendChild(createFieldInput(
          property,
          keys.name,
          resolveSavedOrDefault(savedValues, keys.name, ''),
          { placeholder: n === 1 ? 'Front door' : 'Gate' }
        ));
        tr.appendChild(tdName);

        const tdCode = document.createElement('td');
        tdCode.appendChild(createFieldInput(
          property,
          keys.code,
          resolveSavedOrDefault(savedValues, keys.code, '')
        ));
        tr.appendChild(tdCode);

        const tdLocation = document.createElement('td');
        tdLocation.appendChild(createFieldInput(
          property,
          keys.location,
          resolveSavedOrDefault(savedValues, keys.location, ''),
          { placeholder: 'Where mounted' }
        ));
        tr.appendChild(tdLocation);

        const tdNotes = document.createElement('td');
        tdNotes.appendChild(createFieldInput(
          property,
          keys.notes,
          resolveSavedOrDefault(savedValues, keys.notes, ''),
          { placeholder: 'Keys inside, etc.' }
        ));
        tr.appendChild(tdNotes);

        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      return wrapTable(table);
    }

    function renderProperty(property, savedValues = {}, hasLiveDoc = false) {
      currentHasLiveDoc = Boolean(hasLiveDoc);
      const details = document.createElement('details');
      details.open = true;
      details.dataset.house = property.slug;
      const summary = document.createElement('summary');
      const heading = document.createElement('div'); heading.className = 'flex-between';
      const title = document.createElement('div'); title.className = 'property-title'; title.textContent = property.address;
      const save = document.createElement('button'); save.type = 'button'; save.className = 'save-btn'; save.dataset.save = property.slug; save.textContent = 'Save';
      heading.appendChild(title); heading.appendChild(save); summary.appendChild(heading);
      details.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'property-body';

      let extrasRendered = false;
      property.sections.forEach((section) => {
        if (section.label === 'Lockboxes') return;

        if (section.label === 'Rooms') {
          appendSectionLabel(
            body,
            'Rooms',
            'Room code and lockbox code are separate. House HVAC filter size is in Contact; room size is for window units or exceptions.'
          );
          body.appendChild(renderRoomsTable(property, section, savedValues));
          appendSectionLabel(
            body,
            'Extra Lockboxes',
            'Non-room boxes such as a front door or gate. Same four fields as room lockboxes.'
          );
          body.appendChild(renderExtraLockboxesTable(property, savedValues));
          extrasRendered = true;
          return;
        }

        appendSectionLabel(body, section.label);
        body.appendChild(renderLabelValueTable(property, section, savedValues));
      });
      if (!extrasRendered) {
        appendSectionLabel(
          body,
          'Extra Lockboxes',
          'Non-room boxes such as a front door or gate. Same four fields as room lockboxes.'
        );
        body.appendChild(renderExtraLockboxesTable(property, savedValues));
      }

      appendSectionLabel(
        body,
        HOUSE_NOTES_SECTION.label,
        'Garage AC and other per-house details. Saved with this house, same as Contact.'
      );
      body.appendChild(renderLabelValueTable(property, HOUSE_NOTES_SECTION, savedValues));

      details.appendChild(body);
      currentHasLiveDoc = false;
      return details;
    }

    async function initApiCodes() {
      const generation=codesGeneration, uid=codesUid;
      list.textContent='Loading private property configuration…';
      const workspace=createApiCodesWorkspace({
        api:operationsApi, list, historyButton:document.getElementById('page-history-btn'),
        historyPanel:document.getElementById('page-history-panel'), renderProperty,
        isCurrent:()=>codesGeneration===generation && codesUid===uid && auth.currentUser?.uid===uid,
        onAccessLost:revokeApiCodesAccess, confirmChange:message=>window.confirm(message),
        formatTime:value=>value ? formatDisplayTime(value) : 'unknown time',
        onValue:updateDateOverdueState,
        initialDrafts:apiDraftsByUid.get(uid) || new Map()
      });
      apiWorkspace=workspace;
      try { await workspace.start(); }
      catch(error) { if(error.status===401 || error.status===403) revokeApiCodesAccess(); else throw error; }
    }

    const notesTA = document.getElementById('notes-textarea');
    const notesSave = document.getElementById('notes-save-btn');
    const notesCopy = document.getElementById('notes-copy-btn');
    const notesStatus = document.createElement('p'); notesStatus.setAttribute('role', 'status'); notesTA.before(notesStatus);
    const apiNoteDraftsByUid = new Map();
    if(apiMode) {
      notesTA.disabled=true;notesSave.disabled=true;notesCopy.disabled=true;
      notesTA.addEventListener('input',()=>{notesTA.dataset.dirty='true';});
      apiNotes=createApiNoteBinding({api:operationsApi,textarea:notesTA,status:notesStatus,getUid:()=>codesUid,noteId:'codes',onAccessLost:revokeApiCodesAccess});
      notesSave.addEventListener('click',async()=>{
        if(!codesUid || notesSave.disabled)return;
        notesSave.disabled=true;notesStatus.textContent='Saving notes…';
        try {if(await apiNotes.save()){apiNoteDraftsByUid.delete(codesUid);notesStatus.textContent='Notes saved.';}}
        catch(error) {
          if(error.status===401 || error.status===403) revokeApiCodesAccess();
          else notesStatus.textContent=error.status===409?'Notes changed elsewhere. Your draft is preserved.':'Notes could not be saved. Your draft is preserved.';
        } finally {if(codesUid)notesSave.disabled=false;}
      });
      notesCopy.addEventListener('click',async()=>{
        if(!codesUid)return;
        try {await navigator.clipboard.writeText(notesTA.value);notesStatus.textContent='Notes copied.';}
        catch {notesStatus.textContent='Notes could not be copied.';}
      });
    }
    function revokeApiCodesAccess() {
      if(!apiMode)return;
      operationsApi.clearSession();apiWorkspace?.stop();apiWorkspace=null;apiNotes?.stop();
      apiDraftsByUid.clear();apiNoteDraftsByUid.clear();codesUid=null;codesGeneration++;
      notesTA.value='';delete notesTA.dataset.dirty;notesTA.disabled=true;notesSave.disabled=true;notesCopy.disabled=true;
      showGate();gateError.textContent='Account access expired or was revoked. Sign in again.';gateError.classList.remove('hidden');
    }
    let apiAuthUid;
    async function handleApiAuth(user) {
      const next=user?.uid || null;
      if(next===apiAuthUid)return;
      apiAuthUid=next;
      if(codesUid) {
        if(apiWorkspace)apiDraftsByUid.set(codesUid,apiWorkspace.captureDrafts());
        if(notesTA.dataset.dirty==='true')apiNoteDraftsByUid.set(codesUid,{text:notesTA.value,version:apiNotes.version()});
      }
      if(next && ((apiDraftsByUid.size && !apiDraftsByUid.has(next)) || (apiNoteDraftsByUid.size && !apiNoteDraftsByUid.has(next)))) {
        apiDraftsByUid.clear();apiNoteDraftsByUid.clear();
      }
      operationsApi.clearSession();apiWorkspace?.stop();apiWorkspace=null;apiNotes.stop();
      codesUid=null;codesGeneration++;const generation=codesGeneration;
      notesTA.value='';delete notesTA.dataset.dirty;notesTA.disabled=true;notesSave.disabled=true;notesCopy.disabled=true;
      document.getElementById('page-history-btn').disabled=true;list.replaceChildren();
      const history=document.getElementById('page-history-panel');history.replaceChildren();history.classList.add('hidden');
      showGate();
      if(!user)return;
      gateError.textContent='Checking owner access…';gateError.classList.remove('hidden');
      try {
        const identity=await operationsApi.me();
        if(codesGeneration!==generation || auth.currentUser?.uid!==next)return;
        if(identity?.role!=='owner' || identity.uid!==next) {gateError.textContent='This account does not have access to codes.';return;}
        codesUid=next;gateError.classList.add('hidden');notesTA.disabled=false;notesSave.disabled=false;notesCopy.disabled=false;
        const draft=apiNoteDraftsByUid.get(next);
        if(draft){notesTA.value=draft.text;notesTA.dataset.dirty='true';}
        apiNotes.start(draft?.version);showApp();
      } catch {
        if(codesGeneration===generation && auth.currentUser?.uid===next) {gateError.textContent='Account access could not be verified. Sign in again.';gateError.classList.remove('hidden');}
      }
    }
    onAuthStateChanged(auth, user => { handleApiAuth(user); });
    document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));
  </script>

  <script>
    (() => {
      const toggle = document.querySelector('.password-toggle');
      const input = document.getElementById('gate-input');
      toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.textContent = show ? 'Hide password' : 'Show password';
      });
    })();
  </script>
</body>
</html>
