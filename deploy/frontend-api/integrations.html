<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="padsplit-data-mode" content="api"><title>Integrations · Operations</title>
<link rel="stylesheet" href="./operations.css"><link rel="stylesheet" href="./integrations.css"><link rel="stylesheet" href="./team.css">
<script src="./runtime-config.js"></script><script src="./vendors-api.js"></script><script src="./api-client.js"></script>
<script src="./display-format.js"></script><script src="./integration-status.js"></script><script src="./integrations-api.js"></script><script defer src="./navigation.js"></script></head>
<body><nav class="ops-nav" aria-label="Main navigation"></nav><header class="team-header"><div><p class="eyebrow">Administration</p><h1>Integrations</h1><p>Review recorded collection outcomes and observation times.</p></div><button id="integration-signout" type="button" hidden>Sign out</button></header>
<main class="team-main"><section id="integration-gate" class="team-panel"><h2>Sign in</h2><p id="integration-gate-status" role="status">Checking configuration…</p><form id="integration-signin" hidden><label>Email <input id="integration-email" type="email" autocomplete="username" required></label><label>Password <input id="integration-password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><button id="integration-another" type="button" hidden>Use another account</button></section>
<section id="integration-workspace" class="team-panel integrations-panel" hidden><div class="team-panel-heading"><h2>Collection sources</h2><button id="integration-refresh" type="button">Refresh</button></div><p>This view does not check provider credentials or current connectivity.</p><p id="integration-status" role="status" aria-live="polite"></p><div class="integration-table-wrap"><table><thead><tr><th scope="col">Source</th><th scope="col">Collection outcome</th><th scope="col">Observed</th><th scope="col">Configuration</th><th scope="col">Connection</th></tr></thead><tbody id="integration-rows"></tbody></table></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
const gate=document.getElementById('integration-gate'),gateStatus=document.getElementById('integration-gate-status'),signin=document.getElementById('integration-signin'),password=document.getElementById('integration-password'),panel=document.getElementById('integration-workspace'),signout=document.getElementById('integration-signout'),another=document.getElementById('integration-another');
let runtime;try{runtime=resolveOperationsRuntime(window.PADSPLIT_RUNTIME_CONFIG,true);if(runtime.mode!=='api')throw Error();}catch{gateStatus.textContent='Private integration status is not configured.';throw Error('Integration service unavailable.');}
const auth=getAuth(initializeApp(runtime.firebase)),api=createOperationsApi({baseUrl:runtime.apiOrigin,getUser:()=>auth.currentUser});let workspace=null,generation=0;
function clear(message){generation++;workspace?.stop();workspace=null;api.clearSession();panel.hidden=true;gate.hidden=false;signin.hidden=true;signout.hidden=true;another.hidden=false;gateStatus.textContent=message;}
signin.addEventListener('submit',async event=>{event.preventDefault();const button=signin.querySelector('button');button.disabled=true;try{await signInWithEmailAndPassword(auth,document.getElementById('integration-email').value.trim(),password.value);}catch{gateStatus.textContent='Sign in could not be confirmed.';}finally{password.value='';button.disabled=false;}});
signout.addEventListener('click',()=>signOut(auth));another.addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,user=>{generation++;const current=generation;workspace?.stop();workspace=null;api.clearSession();panel.hidden=true;gate.hidden=false;signout.hidden=true;password.value='';if(!user){signin.hidden=false;another.hidden=true;gateStatus.textContent='Sign in with an authorized owner account.';return;}signin.hidden=true;another.hidden=false;gateStatus.textContent='Checking account access…';const candidate=createIntegrationsWorkspace({api,document,getUid:()=>auth.currentUser?.uid,isCurrent:()=>generation===current&&auth.currentUser===user,onAccessLost:()=>clear('Account access expired or was revoked.')});workspace=candidate;candidate.start().then(()=>{if(current!==generation||auth.currentUser!==user)return;gate.hidden=true;another.hidden=true;panel.hidden=false;signout.hidden=false;}).catch(()=>{if(current!==generation)return;candidate.stop();workspace=null;gateStatus.textContent='Integration access could not be verified.';});});
</script></body></html>
